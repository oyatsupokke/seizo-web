<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>棚卸 — 製造管理</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<header>
  <h1>棚卸</h1>
  <div class="date" id="today"></div>
  <div class="nav">
    <a href="index.html">🏠 今日やること</a>
    <a href="zaiko.html">📦 在庫・発注</a>
  </div>
</header>
<main id="main"><div class="empty">読み込み中…</div></main>

<div class="sheet-bg" id="sheetbg" onclick="closeSheets()"></div>
<div class="sheet" id="sheet-measure">
  <h2 id="measure-title">実測は？</h2>
  <div class="hint" id="measure-theory"></div>
  <div class="seg" id="measure-units" style="margin:8px 0 4px;"></div>
  <div class="qty-row">
    <input type="number" id="measure-qty" inputmode="decimal" step="0.5" min="0" oninput="showConv()">
    <span class="unit-label" id="measure-unit"></span>
  </div>
  <div class="hint" id="measure-conv" style="font-weight:700;"></div>
  <div class="hint" id="measure-hint"></div>
  <div class="row">
    <button class="btn-finish" onclick="saveMeasure()">✔ 記録</button>
  </div>
</div>
<div class="sheet" id="sheet-stale-po">
  <h2>確定の前に：届いたか不明の発注が残っています</h2>
  <div class="hint">「届いていた」＝記録だけ締めます（在庫は今回の実測で合うので動かしません）</div>
  <div id="stale-po-list"></div>
  <div class="row"><button class="btn-primary" onclick="proceedConfirm()">確定に進む</button></div>
</div>
<div class="toast" id="toast"></div>

<script src="api.js"></script>
<script>
/* セクション＝材料カテゴリを「数えて歩く順」のグループにまとめる
   （狭い厨房＝保管場所は使わない。同じ材料が厨房＋予備に分かれるため場所軸は成立しない・2026-08-19まりほ）
   並び順はまりほの歩く順に合わせて調整する（配列の順を変えるだけ） */
const SECTIONS = [
  { name: "粉類",           cats: ["小麦粉", "粉類"] },
  { name: "砂糖・甘味",     cats: ["砂糖", "甘味料"] },
  { name: "乳製品・卵・冷蔵", cats: ["乳製品", "牛乳", "チーズ", "生クリーム", "卵"] },
  { name: "ナッツ・チョコ", cats: ["ナッツ類", "チョコレート"] },
  { name: "フルーツ・ピューレ", cats: ["果物・野菜", "ピューレ", "ドライフルーツ"] },
  { name: "製菓材料・その他", cats: [] },   // どのセクションにも入らない購入材料の受け皿
  { name: "生地（冷凍）",   cats: ["生地"] }, // 冷凍庫の生地ストック（Phase D）
  { name: "半製品",         cats: [] },     // kind=半製品はカテゴリに関係なくここ
];
const FALLBACK = "製菓材料・その他";

let st = null;            // 入力中の棚卸 { id, taken_on, snapshot }
let ingredients = [];     // 有効材料すべて
let items = {};           // ingredient_id -> stocktake_item
let closed = [];          // 締めたセクション
let target = null, useGram = false;
let prevUnit = {};        // ingredient_id -> 前回棚卸で使った単位（数え方の記憶）

function toast(msg) {
  const t = $("toast");
  t.textContent = msg;
  t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), 2500);
}

function sectionOf(ing) {
  const cat = (ing.category || "").trim();
  if (cat === "生地") return "生地（冷凍）";
  if (ing.kind === "半製品") return "半製品";
  for (const s of SECTIONS) if (s.cats.includes(cat)) return s.name;
  return FALLBACK;
}

async function load() {
  const [sts, ings] = await Promise.all([
    rest("stocktakes?status=eq.入力中&select=id,taken_on,snapshot&limit=1"),
    rest("ingredients?is_active=eq.true&select=id,name,kind,category,order_unit,order_unit_to_g&order=name"),
  ]);
  ingredients = ings;
  st = sts[0] || null;
  if (st) {
    const its = await rest(`stocktake_items?stocktake_id=eq.${st.id}&select=*`);
    items = Object.fromEntries(its.map((i) => [i.ingredient_id, i]));
    closed = (st.snapshot && st.snapshot._closed_locations) || [];
  }
  // 前回（確定済み）棚卸の入力単位＝その材料の「数え方」を覚えておく
  try {
    const prev = await rest("stocktakes?status=eq.確定&select=id&order=taken_on.desc&limit=1");
    if (prev.length) {
      const pits = await rest(`stocktake_items?stocktake_id=eq.${prev[0].id}&select=ingredient_id,measured_unit`);
      prevUnit = Object.fromEntries(pits.map((i) => [i.ingredient_id, i.measured_unit]));
    }
  } catch (e) { console.error(e); }
  render();
}

/* ---------- 表示 ---------- */

function theoryG(ing) {
  const v = st?.snapshot?.[ing.id];
  return v != null ? Number(v) : 0;
}

function fmtTheory(ing) {
  const g = theoryG(ing);
  if (ing.order_unit && ing.order_unit_to_g > 0) {
    const n = Math.round((g / ing.order_unit_to_g) * 10) / 10;
    return `${n}${ing.order_unit}（${Math.round(g).toLocaleString()}g）`;
  }
  return `${Math.round(g).toLocaleString()}g`;
}

function fmtMeasured(it) {
  return `${Number(it.measured_amount)}${it.measured_unit || "g"}`;
}

function render() {
  $("today").textContent = jpDate(new Date());
  const el = $("main");
  if (!st) {
    el.innerHTML = `<div class="empty" style="padding-top:60px;">
      棚卸はまだ始まっていません。<br><br>
      始めると、その時点の「アプリ上の残り」が記録されます。<br>
      数えるのは<b>実物がアプリの数字と違う物だけ</b>でOK。<br>
      グループごとに分担して、別の日に続きをやっても大丈夫です。<br><br>
      <button class="btn-primary" style="max-width:320px;" onclick="startStocktake()">📋 棚卸をはじめる</button>
    </div>`;
    return;
  }

  // カテゴリのセクションごとに表示（歩く順＝SECTIONSの並び）
  const groups = {};
  for (const ing of ingredients) {
    const sec = sectionOf(ing);
    (groups[sec] = groups[sec] || []).push(ing);
  }
  const secs = SECTIONS.map((s) => s.name).filter((n) => groups[n]);

  const allClosed = secs.every((n) => closed.includes(n));
  const doneCount = Object.keys(items).length;

  let html = `<div class="stocktake-head">
    <div>${mmdd(st.taken_on)} 開始の棚卸（入力中）</div>
    <div class="alert-sub">実測を入れたのは ${doneCount}件。入れなかった材料は「アプリの数字どおり」として扱われます。厨房と予備置き場、両方あわせた量で数えてください</div>
  </div>`;

  for (const sec of secs) {
    const isClosed = closed.includes(sec);
    html += `<div class="loc-section${isClosed ? " closed" : ""}">
      <div class="loc-header">
        <span class="loc-name">${esc(sec)}（${groups[sec].length}）</span>
        ${isClosed
          ? `<span class="loc-done">✔ おわり <button class="btn-revert" onclick="reopenLoc('${esc(sec)}')">開け直す</button></span>`
          : `<button class="btn-close-loc" onclick="closeLoc('${esc(sec)}')">このグループおわり</button>`}
      </div>`;
    for (const ing of groups[sec]) {
      const it = items[ing.id];
      html += `<div class="tana-row${it ? " measured" : ""}">
        <div class="tana-main" onclick="openMeasure('${ing.id}')">
          <span class="tana-name">${esc(ing.name)}</span>
          <span class="tana-val">${it ? `実測 ${fmtMeasured(it)}` : `記録 ${fmtTheory(ing)}`}</span>
        </div>
      </div>`;
    }
    html += `</div>`;
  }

  html += `<div class="confirm-area">
    ${allClosed
      ? `<button class="btn-primary" onclick="confirmStocktake()">✅ 棚卸を確定する（まりほ）</button>`
      : `<button class="btn-primary" disabled>確定（すべてのグループを「おわり」にすると押せます）</button>`}
  </div>`;
  el.innerHTML = html;
}

/* ---------- 開始 ---------- */

async function startStocktake() {
  try {
    await rpc("fn_start_stocktake");
    await load();
    toast("棚卸を開始しました");
  } catch (e) { toast("開始に失敗しました"); console.error(e); }
}

/* ---------- 実測入力（発注単位0.5刻み・半製品/未設定はg） ---------- */

function openMeasure(id) {
  target = ingredients.find((i) => i.id === id);
  if (!target) return;
  const hasUnit = !!(target.order_unit && target.order_unit_to_g > 0);
  // 数え方の初期値：この棚卸で入れた単位 → 前回棚卸の単位 → 発注単位 → g
  const it = items[id];
  const remembered = it?.measured_unit || prevUnit[id] || null;
  useGram = hasUnit ? (remembered ? remembered === "g" : false) : true;
  $("measure-title").textContent = target.name;
  $("measure-theory").textContent = `いまアプリ上の残り：${fmtTheory(target)}`;
  $("measure-qty").value = it ? Number(it.measured_amount) : "";
  applyUnitLabel();
  show("sheet-measure");
  $("measure-qty").focus();
}

function applyUnitLabel() {
  const hasUnit = !useGram && target.order_unit && target.order_unit_to_g > 0;
  const canUnit = !!(target.order_unit && target.order_unit_to_g > 0);
  // 単位はチップで選ぶ（材料ごと・前回の選択を記憶）。中身のgを常に併記して曖昧さをなくす
  $("measure-units").innerHTML = canUnit
    ? `<button type="button" class="${!useGram ? "selected" : ""}" onclick="setUnit(false)">${esc(target.order_unit)}で数える（1${esc(target.order_unit)}=${Number(target.order_unit_to_g).toLocaleString()}g）</button>
       <button type="button" class="${useGram ? "selected" : ""}" onclick="setUnit(true)">gで入力</button>`
    : "";
  $("measure-units").style.display = canUnit ? "" : "none";
  $("measure-unit").textContent = hasUnit ? target.order_unit : "g";
  $("measure-qty").step = hasUnit ? 0.5 : 1;
  // 「厨房＋予備あわせて」は入力の瞬間に読まれる場所へ常設（genba指定）
  $("measure-hint").textContent = (hasUnit
    ? `0.5${target.order_unit}きざみでOK`
    : "グラムで入力してください") + "。厨房と予備、あわせた量で";
  showConv();
}

function setUnit(g) { useGram = g; $("measure-qty").value = ""; applyUnitLabel(); }

// 打った瞬間にg換算（またはg→単位換算）を出す＝「1.5袋って結局何g？」を無くす
function showConv() {
  const v = Number($("measure-qty").value);
  const el = $("measure-conv");
  if (!$("measure-qty").value || !(target.order_unit && target.order_unit_to_g > 0)) { el.textContent = ""; return; }
  el.textContent = useGram
    ? `= ${(Math.round((v / target.order_unit_to_g) * 100) / 100)}${target.order_unit}ぶん`
    : `= ${Math.round(v * target.order_unit_to_g).toLocaleString()}g`;
}

async function saveMeasure() {
  const v = Number($("measure-qty").value);
  if ($("measure-qty").value === "" || v < 0) { toast("数量を入れてください"); return; }
  const hasUnit = !useGram && target.order_unit && target.order_unit_to_g > 0;
  const unit = hasUnit ? target.order_unit : "g";
  const grams = hasUnit ? v * target.order_unit_to_g : v;
  try {
    await rpc("fn_set_stocktake_item", {
      p_stocktake_id: st.id, p_ingredient_id: target.id,
      p_measured: v, p_unit: unit, p_measured_g: grams,
    });
    items[target.id] = { ingredient_id: target.id, measured_amount: v, measured_unit: unit, measured_g: grams };
    closeSheets();
    render();
  } catch (e) { toast("記録に失敗しました"); console.error(e); }
}

/* ---------- 「このグループおわり」（全グループが締まるまで確定不可） ---------- */

async function saveClosed() {
  // snapshotに締め状態を持たせる（理論在庫のキーはuuidなので衝突しない）
  const snapshot = { ...(st.snapshot || {}), _closed_locations: closed };
  await apiFetch(`/rest/v1/stocktakes?id=eq.${st.id}`, {
    method: "PATCH", body: JSON.stringify({ snapshot }),
  });
  st.snapshot = snapshot;
}

async function closeLoc(sec) {
  if (!closed.includes(sec)) closed.push(sec);
  render();
  try { await saveClosed(); } catch (e) { toast("保存に失敗しました"); console.error(e); }
}

async function reopenLoc(sec) {
  closed = closed.filter((l) => l !== sec);
  render();
  try { await saveClosed(); } catch (e) { toast("保存に失敗しました"); console.error(e); }
}

/* ---------- 確定（まりほ） ---------- */

// 確定前の回収網：5日以上前の「発注済」が残っていたら届いた/来なかったを選ばせる
// （放置された発注済は予測在庫を水増しして不足アラートを黙らせるため、月1のここで必ず拾う）
let stalePOs = [];

async function confirmStocktake() {
  const since = new Date(Date.now() - 5 * 86400000).toISOString().slice(0, 10);
  stalePOs = await rest(`purchase_orders?status=eq.発注済&ordered_on=lte.${since}&select=*&order=ordered_on`).catch(() => []);
  if (stalePOs.length) { renderStalePOs(); show("sheet-stale-po"); return; }
  proceedConfirm();
}

function renderStalePOs() {
  $("stale-po-list").innerHTML = stalePOs.map((po) => {
    const ing = ingredients.find((i) => i.id === po.ingredient_id);
    return `<div class="tana-row" id="stale-${po.id}">
      <div class="tana-main"><span class="tana-name">${esc(ing?.name || "？")} ${Number(po.quantity)}${esc(po.quantity_unit || "g")}</span>
      <span class="tana-val">${po.ordered_on ? mmdd(po.ordered_on) + "発注" : ""}</span></div>
      <button class="btn-loc" onclick="resolveStalePO('${po.id}','入荷済')">届いていた</button>
      <button class="btn-revert" onclick="resolveStalePO('${po.id}','取消')">来なかった</button>
    </div>`;
  }).join("");
}

async function resolveStalePO(poId, status) {
  try {
    await apiFetch(`/rest/v1/purchase_orders?id=eq.${poId}`, { method: "PATCH", body: JSON.stringify({ status }) });
    stalePOs = stalePOs.filter((p) => p.id !== poId);
    if (stalePOs.length) renderStalePOs();
    else { closeSheets(); proceedConfirm(); }
  } catch (e) { toast("保存に失敗しました"); console.error(e); }
}

async function proceedConfirm() {
  closeSheets();
  const n = Object.keys(items).length;
  if (!confirm(`棚卸を確定します（実測 ${n}件・未入力はアプリの数字どおり）。\n実物との差が「棚卸補正」として在庫に反映されます。よろしいですか？`)) return;
  try {
    const fixed = await rpc("fn_confirm_stocktake", { p_stocktake_id: st.id });
    toast(`確定しました（補正 ${fixed}件）`);
    st = null; items = {}; closed = [];
    await load();
  } catch (e) { toast("確定に失敗しました"); console.error(e); }
}

function show(id) { $("sheetbg").style.display = "block"; $(id).style.display = "block"; }
function hide(id) { $(id).style.display = "none"; }
function closeSheets() {
  for (const id of ["sheet-measure", "sheet-stale-po"]) hide(id);
  $("sheetbg").style.display = "none";
}

if (requireLogin()) {
  load().catch((e) => { $("main").innerHTML = `<div class="empty">読み込みエラー：${esc(e.message)}</div>`; });
}
</script>
</body>
</html>
