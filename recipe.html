<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>レシピ登録 — 製造管理</title>
<link rel="stylesheet" href="app.css">
<style>
  .combo{display:flex; gap:6px;}
  .combo-toggle{flex:0 0 52px; background:#efeaf9; color:#5b3fa8; font-size:1rem; border-radius:10px;}
  .combo-panel{background:#fff; border:1px solid #ddd; border-radius:10px; margin-top:6px; max-height:45vh; overflow-y:auto; padding:8px;}
  .combo-list button{display:block; width:100%; text-align:left; background:#f9f7f3; margin:5px 0; padding:11px 12px; font-weight:400; font-size:.95rem; border-radius:8px;}
  .combo-list button.free{background:#fdf3e0; color:#b26a00; font-weight:700;}
  .combo-list .none{color:#888; font-size:.85rem; padding:8px 4px;}
  .r-status{background:#eef7ee; color:#2e7d32; border-radius:10px; padding:10px 12px; font-size:.9rem; font-weight:700; margin:8px 0;}
  .r-status.new{background:#e8f0fe; color:#1a56b0;}
  .item-row{display:flex; align-items:center; gap:8px; background:#fff; border-radius:10px; padding:8px 10px; margin:6px 0;}
  .item-row .nm{flex:1; font-size:.95rem; min-width:0; overflow-wrap:anywhere;}
  .item-row .nm .kiji{color:#5b3fa8; font-weight:700;}
  .item-row input{flex:0 0 96px; width:96px; text-align:right; font-size:1.05rem; padding:8px;}
  .item-row .unit{flex:0 0 auto; color:#777; font-size:.9rem;}
  .item-row .rm{flex:0 0 auto; background:#fbe9e9; color:#c62828; border-radius:8px; width:38px; height:38px; font-size:1rem;}
  .sum-bar{display:flex; justify-content:space-between; background:#f4f0fa; border-radius:10px; padding:10px 14px; margin:10px 0; font-weight:700;}
  .sheet-bg{position:fixed; inset:0; background:rgba(0,0,0,.35); display:none; z-index:20;}
  .sheet{position:fixed; left:0; right:0; bottom:0; background:#fff; border-radius:18px 18px 0 0; padding:18px 16px 26px; z-index:21; display:none; max-height:80vh; overflow-y:auto;}
  .sheet h2{font-size:1.05rem; margin:0 0 10px;}
  .diff{background:#fdf6e8; border-radius:10px; padding:10px 12px; font-size:.9rem; margin:10px 0;}
  .diff .minus{color:#c62828; font-weight:700;}
  .diff .plus{color:#2e7d32; font-weight:700;}
  .yield-ask{background:#fff8e1; border-radius:10px; padding:12px; margin:10px 0;}
  .yield-ask label{font-weight:700; font-size:.95rem;}
  .yield-ask input{width:110px; text-align:right; font-size:1.1rem; margin:6px 8px 0 0;}
  .yield-warn{color:#b26a00; font-size:.8rem; margin-top:4px;}
  .draft-bar{background:#fdf3e0; border-radius:10px; padding:10px 12px; font-size:.9rem; margin:8px 0; display:none;}
  .draft-bar button{background:#b26a00; color:#fff; border-radius:8px; padding:6px 12px; margin-left:8px; font-size:.85rem;}
  .preview{background:#fff; border-radius:12px; padding:14px; margin:10px 0; display:none;}
  .preview table{width:100%; border-collapse:collapse; font-size:.9rem;}
  .preview td{padding:5px 4px; border-bottom:1px solid #f0ece4;}
  .preview td:last-child{text-align:right; font-variant-numeric:tabular-nums;}
</style>
</head>
<body>
<header>
  <h1>レシピ登録</h1>
  <div class="nav"><a href="index.html">🏠 今日やること</a><a href="plan.html">📅 予定</a></div>
</header>
<main>
  <div class="draft-bar" id="draft-bar">✍️ 書きかけのレシピがあります<button onclick="restoreDraft()">復元する</button><button style="background:#999" onclick="dropDraft()">捨てる</button></div>

  <label>なんのレシピ？（名前を打つ → あれば開く・なければ新規作成）</label>
  <div class="combo">
    <input type="text" id="t-search" placeholder="商品・生地の名前（例：バターサブレ）" autocomplete="off">
    <button type="button" class="combo-toggle" id="t-toggle">▾</button>
  </div>
  <div class="combo-panel" id="t-panel" style="display:none">
    <div class="cat-chips" id="t-cats"></div>
    <div class="combo-list" id="t-list"></div>
  </div>
  <div class="r-status" id="r-status" style="display:none"></div>

  <div id="editor" style="display:none">
    <label>材料（検索してタップで追加）</label>
    <div class="combo">
      <input type="text" id="i-search" placeholder="材料名を打つ（例：バター）" autocomplete="off">
      <button type="button" class="combo-toggle" id="i-toggle">▾</button>
    </div>
    <div class="combo-panel" id="i-panel" style="display:none">
      <div class="combo-list" id="i-list"></div>
    </div>

    <div id="rows"></div>
    <div class="sum-bar"><span>合計（仕込み1回分）</span><span id="sum">0g</span></div>

    <label>製法メモ（任意）</label>
    <textarea id="memo" rows="3" style="width:100%; font-size:.95rem; padding:10px; border-radius:10px; border:1px solid #ddd;"></textarea>

    <div style="margin-top:18px"><button class="btn-primary" id="save-btn" onclick="openConfirm()">保存する</button></div>
  </div>

  <div class="preview" id="preview"></div>
</main>

<div class="sheet-bg" id="sheet-bg" onclick="closeConfirm()"></div>
<div class="sheet" id="sheet">
  <h2 id="s-title"></h2>
  <div id="s-body"></div>
  <div class="yield-ask" id="s-yield" style="display:none">
    <label>仕込み1回分で何個できますか？</label><br>
    <input type="number" id="s-yield-n" inputmode="decimal" min="1" step="1"><span>個</span>
    <div class="yield-warn" id="s-yield-warn">空欄でも保存できますが、1個あたり原価が出ません</div>
  </div>
  <div style="display:flex; gap:10px; margin-top:14px">
    <button style="flex:1; background:#eee" onclick="closeConfirm()">もどる</button>
    <button class="btn-primary" style="flex:2" id="s-save" onclick="doSave()">保存する</button>
  </div>
</div>
<div class="toast" id="toast"></div>

<script src="api.js?v=20260824"></script>
<script>
const DRAFT_KEY = "seizo_recipe_draft";
let products = [], hanseihin = [], ingredients = [];
let hasRecipe = new Set();  // レシピ登録済みのproduct_id/ingredient_id（一覧で有無を見せる）
let target = null;          // {id, name, isIng, category, yield_per_batch}
let rows = [];              // [{iid, name, isHansei, g}]
let oldItems = null;        // 既存レシピの材料（差分表示用）。新規はnull
let oldMemo = "";
let selCat = null;

function toast(msg){ const t=$("toast"); t.textContent=msg; t.classList.add("show"); setTimeout(()=>t.classList.remove("show"),2500); }
function norm(s){ return (s||"").normalize("NFKC").replace(/[\s　]/g,"").replace(/[ぁ-ゖ]/g,(c)=>String.fromCharCode(c.charCodeAt(0)+0x60)); }
function fmtG(n){ return Number(n).toLocaleString("ja-JP", {maximumFractionDigits:1}) + "g"; }

/* ---------- 対象コンボ（商品＋生地・半製品） ---------- */

function tCandidates(){ return [...products, ...hanseihin]; }
function itemCat(p){ return p.isIng ? (p.category === "生地" ? "生地" : "半製品") : (p.category || "その他"); }
function itemLabel(p){
  if (!p.isIng) return esc(p.name);
  if (p.category === "生地") return `<b>生地｜</b>${esc(p.name.replace(/生地$/, ""))}`;
  return `${esc(p.name)}〔半製品〕`;
}
function catList(){
  const cats = [...new Set(tCandidates().map(itemCat))];
  return cats.sort((a,b) => (a==="半製品")-(b==="半製品") || (a==="生地")-(b==="生地") || a.localeCompare(b,"ja"));
}
function renderTPanel(){
  $("t-cats").innerHTML =
    `<button type="button" class="${selCat===null?"selected":""}" onclick="setCat(null)">すべて</button>` +
    catList().map((c)=>`<button type="button" class="${selCat===c?"selected":""}" onclick="setCat('${esc(c)}')">${esc(c)}</button>`).join("");
  const q = $("t-search").value.trim();
  let list = tCandidates();
  if (selCat) list = list.filter((p)=>itemCat(p)===selCat);
  if (q) list = list.filter((p)=>p.name.includes(q) || norm(p.name).includes(norm(q)));
  // レシピの有無を一覧の時点で見せる（まりほ指摘：名前が出ると「あるっぽい」のに押すと新規でややこしい）
  let html = list.slice(0,40).map((p)=>{
    const mark = hasRecipe.has(p.id)
      ? ` <span style="font-size:.8rem">📖</span>`
      : ` <span style="font-size:.72rem; color:#b26a00; background:#fdf3e0; border-radius:6px; padding:1px 6px; font-weight:700">レシピなし→新規</span>`;
    return `<button type="button" onclick="pickTarget('${p.id}',${p.isIng?1:0})">${itemLabel(p)}${mark}</button>`;
  }).join("");
  if (!list.length) html = `<div class="none">一致するものがありません</div>`;
  if (list.length > 40) html += `<div class="none">ほか${list.length-40}件（打って絞り込んでください）</div>`;
  // マスタに無い名前＝新商品・新生地。ここが新規レシピの入口（まりほ指摘：新規なら選ぶものが無い）
  if (q && !tCandidates().some((p)=>norm(p.name)===norm(q))){
    html += `<button type="button" class="free" onclick="createTarget('product')">🆕 新しい商品「${esc(q)}」としてレシピを作る</button>`;
    html += `<button type="button" class="free" onclick="createTarget('dough')">🧊 新しい生地「${esc(q)}」としてレシピを作る（冷凍ストック用）</button>`;
  }
  $("t-list").innerHTML = html;
}

// 新しい商品／生地をその場で作ってレシピ登録に進む
async function createTarget(kind){
  const name = $("t-search").value.trim();
  if (!name) return;
  try {
    if (kind === "product"){
      const row = await createProduct(name);
      products.push(row);
      toast(`商品「${name}」を登録しました`);
      await pickTarget(row.id, 0);
    } else {
      const [row] = await insert("ingredients", { tenant_id: await myTenantId(), name, category: "生地", kind: "半製品", unit: "g", is_active: true });
      ingredients.push(row);
      const h = { ...row, isIng: true };
      hanseihin.push(h);
      toast(`生地「${name}」を登録しました`);
      await pickTarget(row.id, 1);
    }
  } catch(e){ toast("登録に失敗しました"); console.error(e); }
}
function setCat(c){ selCat = c; renderTPanel(); }

async function pickTarget(id, isIng){
  target = tCandidates().find((p)=>p.id===id && !!p.isIng===!!isIng);
  $("t-search").value = target.name;
  $("t-panel").style.display = "none";
  rows = []; oldItems = null; oldMemo = "";
  // 既存レシピを読む（あれば編集モード）
  const col = target.isIng ? "ingredient_id" : "product_id";
  const rs = await rest(`recipes?${col}=eq.${target.id}&is_active=is.true&select=id,method_memo,recipe_items(ingredient_id,amount_g_per_batch)&limit=1`);
  if (rs.length){
    const r = rs[0];
    oldMemo = r.method_memo || "";
    oldItems = r.recipe_items.map((it)=>{
      const ing = ingredients.find((x)=>x.id===it.ingredient_id);
      return { iid: it.ingredient_id, name: ing?.name || "（不明な材料）", isHansei: ing?.kind==="半製品", g: Number(it.amount_g_per_batch) };
    });
    rows = oldItems.map((x)=>({ ...x }));
    $("memo").value = oldMemo;
    $("r-status").className = "r-status";
    $("r-status").textContent = `✔ 登録済みレシピを開きました（材料${rows.length}点・合計${fmtG(rows.reduce((a,b)=>a+b.g,0))}）。保存すると差し替わります`;
  } else {
    $("memo").value = "";
    $("r-status").className = "r-status new";
    $("r-status").textContent = "🆕 レシピ未登録です。新しく作ります";
  }
  $("r-status").style.display = "block";
  $("editor").style.display = "block";
  $("preview").style.display = "none";
  renderRows(); saveDraft();
}

/* ---------- 材料コンボ ---------- */

function renderIPanel(){
  const q = $("i-search").value.trim();
  let list = ingredients.filter((i)=>i.is_active !== false);
  // 半製品レシピのときは自分自身を除外
  if (target?.isIng) list = list.filter((i)=>i.id !== target.id);
  // 追加済みは除外
  list = list.filter((i)=>!rows.some((r)=>r.iid===i.id));
  if (q) list = list.filter((i)=>i.name.includes(q) || norm(i.name).includes(norm(q)));
  let html = list.slice(0,30).map((i)=>{
    const tag = i.kind==="半製品" ? (i.category==="生地" ? `<b class="kiji">生地｜</b>` : "〔半製品〕") : "";
    return `<button type="button" onclick="addRow('${i.id}')">${i.category==="生地"?tag+esc(i.name.replace(/生地$/,"")):esc(i.name)+ (i.kind==="半製品"&&i.category!=="生地"?"〔半製品〕":"")}</button>`;
  }).join("");
  if (!list.length && !q) html = `<div class="none">材料名を打ってください</div>`;
  if (!list.length && q) html = `<div class="none">一致する材料がありません</div>`;
  // マスタに無い材料の仮登録（めったに無い・genba：先に近い候補を見せる→上のリストがそれ）
  if (q && !ingredients.some((i)=>norm(i.name)===norm(q))){
    html += `<button type="button" class="free" onclick="addTempIngredient()">「${esc(q)}」をマスタに仮登録して使う（単価はあとで設定）</button>`;
  }
  $("i-list").innerHTML = html;
}

function addRow(iid){
  const ing = ingredients.find((x)=>x.id===iid);
  if (!ing || rows.some((r)=>r.iid===iid)) return;
  rows.push({ iid, name: ing.name, isHansei: ing.kind==="半製品", g: null });
  $("i-search").value = "";
  $("i-panel").style.display = "none";
  renderRows(); saveDraft();
  // 追加した行のg欄へ自動フォーカス（genba：キーボード切替の迷子防止）
  setTimeout(()=>{ const el = document.getElementById(`g-${iid}`); if (el) el.focus(); }, 50);
}

async function addTempIngredient(){
  const name = $("i-search").value.trim();
  if (!name) return;
  try {
    const [row] = await insert("ingredients", {
      tenant_id: await myTenantId(), name, category: "未分類", kind: "購入材料", unit: "g", is_active: true,
    });
    ingredients.push(row);
    toast(`「${name}」を仮登録しました（単価はあとで設定）`);
    addRow(row.id);
  } catch(e){ toast("仮登録に失敗しました"); console.error(e); }
}

function renderRows(){
  $("rows").innerHTML = rows.map((r)=>`
    <div class="item-row">
      <span class="nm">${r.isHansei ? `<span class="kiji">${esc(r.name)}</span>` : esc(r.name)}</span>
      <input type="number" id="g-${r.iid}" inputmode="decimal" min="0" step="any" placeholder="g"
        value="${r.g ?? ""}" onchange="setG('${r.iid}', this.value)" onkeydown="if(event.key==='Enter'){this.blur(); $('i-search').focus();}">
      <span class="unit">g</span>
      <button type="button" class="rm" onclick="rmRow('${r.iid}')">×</button>
    </div>`).join("");
  $("sum").textContent = fmtG(rows.reduce((a,b)=>a+(b.g||0),0));
}
function setG(iid, v){
  const r = rows.find((x)=>x.iid===iid);
  if (r) r.g = v === "" ? null : Number(v);
  $("sum").textContent = fmtG(rows.reduce((a,b)=>a+(b.g||0),0));
  saveDraft();
}
function rmRow(iid){ rows = rows.filter((r)=>r.iid!==iid); renderRows(); saveDraft(); }

/* ---------- 下書き自動退避（電話・来客の割り込みで全消え防止・genba B） ---------- */

let restoring = false;   // 復元中にpickTarget内のsaveDraftが空rowsで下書きを潰すのを防ぐ
function saveDraft(){
  if (restoring || !target) return;
  localStorage.setItem(DRAFT_KEY, JSON.stringify({
    tid: target.id, tIsIng: !!target.isIng, tName: target.name,
    rows, memo: $("memo").value, at: Date.now(),
  }));
}
function checkDraft(){
  try {
    const d = JSON.parse(localStorage.getItem(DRAFT_KEY));
    if (d && d.rows?.length && Date.now() - d.at < 24*3600*1000) { $("draft-bar").style.display = "block"; return; }
  } catch {}
  localStorage.removeItem(DRAFT_KEY);
}
async function restoreDraft(){
  const d = JSON.parse(localStorage.getItem(DRAFT_KEY));
  if (!d) return;
  restoring = true;
  try {
    await pickTarget(d.tid, d.tIsIng ? 1 : 0);
    rows = d.rows; $("memo").value = d.memo || "";
    renderRows();
  } finally { restoring = false; }
  saveDraft();
  $("draft-bar").style.display = "none";
  toast("書きかけを復元しました");
}
function dropDraft(){ localStorage.removeItem(DRAFT_KEY); $("draft-bar").style.display = "none"; }

/* ---------- 保存（確認シート：差分表示＋できあがり個数） ---------- */

function openConfirm(){
  if (!target) { toast("対象を選んでください"); return; }
  if (!rows.length) { toast("材料を追加してください"); return; }
  const bad = rows.filter((r)=>!r.g || r.g <= 0);
  if (bad.length) { toast(`gが入っていない材料があります（${bad[0].name}）`); return; }

  $("s-title").textContent = `「${target.name}」のレシピを保存します`;
  const total = rows.reduce((a,b)=>a+b.g,0);
  let body = `<div>材料 ${rows.length}点・合計 ${fmtG(total)}</div>`;
  // 編集時は差分を出す（genba：誤削除は差分表示でしか気づけない）
  if (oldItems){
    const oldTotal = oldItems.reduce((a,b)=>a+b.g,0);
    const removed = oldItems.filter((o)=>!rows.some((r)=>r.iid===o.iid));
    const added = rows.filter((r)=>!oldItems.some((o)=>o.iid===r.iid));
    const changed = rows.filter((r)=>{ const o = oldItems.find((x)=>x.iid===r.iid); return o && o.g !== r.g; });
    let d = `<div>変更前：材料 ${oldItems.length}点・合計 ${fmtG(oldTotal)} → 変更後：材料 ${rows.length}点・合計 ${fmtG(total)}</div>`;
    if (removed.length) d += `<div class="minus">− 消える材料：${removed.map((x)=>esc(x.name)).join("・")}</div>`;
    if (added.length) d += `<div class="plus">＋ 増える材料：${added.map((x)=>esc(x.name)).join("・")}</div>`;
    for (const c of changed){ const o = oldItems.find((x)=>x.iid===c.iid); d += `<div>◇ ${esc(c.name)}：${fmtG(o.g)} → <b>${fmtG(c.g)}</b></div>`; }
    if (!removed.length && !added.length && !changed.length) d += `<div>（材料と分量の変更はありません）</div>`;
    body += `<div class="diff">${d}</div>`;
  }
  $("s-body").innerHTML = body;
  // できあがり個数（商品レシピのみ・実質必須：1バッチ＝仕込み1回分の自己定義）
  if (!target.isIng){
    $("s-yield").style.display = "block";
    $("s-yield-n").value = target.yield_per_batch || "";
  } else {
    $("s-yield").style.display = "none";
  }
  $("sheet-bg").style.display = "block";
  $("sheet").style.display = "block";
}
function closeConfirm(){ $("sheet-bg").style.display = "none"; $("sheet").style.display = "none"; }

async function doSave(){
  const btn = $("s-save"); btn.disabled = true;
  try {
    const yieldN = !target.isIng ? Number($("s-yield-n").value) || null : null;
    await rpc("fn_save_recipe", {
      p_target_kind: target.isIng ? "ingredient" : "product",
      p_target_id: target.id,
      p_items: rows.map((r)=>({ ingredient_id: r.iid, amount_g: r.g })),
      p_memo: $("memo").value.trim() || null,
      p_yield: yieldN,
    });
    if (yieldN) target.yield_per_batch = yieldN;
    hasRecipe.add(target.id);
    closeConfirm();
    localStorage.removeItem(DRAFT_KEY);
    // 保存後プレビュー（自分の入力を最終確認できる・📖と同じ見え方）
    const total = rows.reduce((a,b)=>a+b.g,0);
    $("preview").innerHTML = `<b>✅ 保存しました：${esc(target.name)}</b>
      <table>${rows.map((r)=>`<tr><td>${r.isHansei?`<span style="color:#5b3fa8;font-weight:700">${esc(r.name)}</span>`:esc(r.name)}</td><td>${fmtG(r.g)}</td></tr>`).join("")}
      <tr><td><b>合計（仕込み1回分）</b></td><td><b>${fmtG(total)}</b></td></tr>
      ${yieldN?`<tr><td>できあがり</td><td>${yieldN}個</td></tr>`:""}</table>
      ${$("memo").value.trim()?`<div style="margin-top:8px; font-size:.85rem; color:#666">📝 ${esc($("memo").value.trim())}</div>`:""}`;
    $("preview").style.display = "block";
    oldItems = rows.map((x)=>({ ...x }));
    $("r-status").className = "r-status";
    $("r-status").textContent = `✔ 登録済み（材料${rows.length}点・合計${fmtG(total)}）`;
    toast("レシピを保存しました");
    window.scrollTo({ top: document.body.scrollHeight, behavior: "smooth" });
  } catch(e){
    toast("保存に失敗しました：" + (e.message || "").slice(0, 80));
    console.error(e);
  } finally { btn.disabled = false; }
}

let _tid = null;
