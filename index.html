<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>今日やること — 製造管理</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<header>
  <h1>今日やること</h1>
  <div class="date" id="today"></div>
  <div class="progress-wrap"><div class="progress-bar" id="pbar"></div></div>
  <div class="progress-label" id="plabel"></div>
  <div class="nav"><a href="plan.html">📅 予定登録・一覧</a><a href="zaiko.html">📦 在庫・発注</a><a href="tanaoroshi.html">📋 棚卸</a></div>
  <div id="alertband"></div>
</header>
<main id="list"><div class="empty">読み込み中…</div></main>
<div class="fab" onclick="openProductSheet()">＋ 臨時で仕込む</div>

<div class="sheet-bg" id="sheetbg" onclick="closeSheets()"></div>
<div class="sheet" id="sheet-product">
  <h2>何を仕込む？</h2>
  <input type="text" id="product-search" placeholder="名前で検索（半製品も出ます）" oninput="renderProductGrid()">
  <div class="cat-chips" id="product-cats" style="margin-top:8px;"></div>
  <div class="grid" id="product-grid" style="margin-top:8px;"></div>
</div>
<div class="sheet" id="sheet-recipe">
  <h2 id="recipe-title">レシピ</h2>
  <div id="recipe-body" style="max-height:60vh; overflow-y:auto;"></div>
</div>
<div class="sheet" id="sheet-work">
  <h2 id="work-title">作業内容は？</h2>
  <div class="grid">
    <button onclick="pickWork('weigh')">⚖️ 計量<br><small>記録のみ・在庫は動かない</small></button>
    <button onclick="pickWork('dough')">🥣 仕込み<br><small>生地を作って冷凍（材料↓ 生地↑）</small></button>
    <button onclick="pickWork('bake')">🔥 焼成<br><small>冷凍生地を使う（生地↓）</small></button>
  </div>
</div>
<div class="sheet" id="sheet-batch">
  <h2 id="batch-title">バッチ数は？</h2>
  <div class="grid">
    <button onclick="quickAdd(1)">1バッチ</button>
    <button onclick="quickAdd(2)">2バッチ</button>
    <button onclick="quickAdd(3)">3バッチ</button>
    <button onclick="quickAdd(4)">4バッチ</button>
    <button class="other" onclick="quickAddOther()">その他の数</button>
  </div>
</div>
<div class="sheet" id="sheet-member">
  <h2>担当者</h2>
  <div class="grid" id="member-grid"></div>
</div>
<div class="toast" id="toast"></div>

<script src="api.js"></script>
<script>
let tasks = [], members = [], products = [];
let pendingProduct = null, memberTarget = null;

function toast(msg) {
  const t = $("toast");
  t.textContent = msg;
  t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), 2500);
}

async function load() {
  const [t, m, al] = await Promise.all([
    rest("v_today_tasks?select=*"),
    rest("members?select=id,display_name&is_active=eq.true&order=sort_order"),
    rest("v_order_alerts?alert_kind=eq.不足&kind=eq.購入材料&select=name,runout_date&order=runout_date").catch(() => []),
  ]);
  tasks = t; members = m;
  renderAlertBand(al);
  render();
}

/* 不足アラートの赤帯（初回棚卸の確定まではビュー側で0件＝非表示） */
function renderAlertBand(al) {
  const el = $("alertband");
  if (!al.length) { el.innerHTML = ""; return; }
  const head = al[0].name + (al.length > 1 ? ` ほか${al.length - 1}件` : "");
  el.innerHTML = `<a class="alert-band" href="zaiko.html">⚠ 材料不足：${esc(head)} — タップで確認</a>`;
}

let doughFor = {};   // product_id -> {id, name}（生地。商品→作業の2段選択用）
async function loadProducts() {
  if (products.length) return;
  // 半製品（カスタード等）も選べるようにする＝半製品仕込みの製造入庫を自由入力で取りこぼさない
  // 生地は一覧に出さない（商品を選んでから「生地を作る／焼く」を選ぶ方式・2026-08-20まりほ）
  const [p, h] = await Promise.all([
    rest("products?select=id,name,category,yield_per_batch&is_active=eq.true&order=name&limit=300"),
    rest("ingredients?kind=eq.半製品&is_active=eq.true&select=id,name,category&order=name"),
  ]);
  products = [...p, ...h.filter((x) => x.category !== "生地").map((x) => ({ ...x, isIng: true }))];
  const doughs = h.filter((x) => x.category === "生地");
  if (doughs.length && !Object.keys(doughFor).length) {
    const ids = doughs.map((d) => d.id).join(",");
    const rows = await rest(`recipe_items?ingredient_id=in.(${ids})&select=ingredient_id,recipes!inner(product_id,is_active)&recipes.is_active=is.true`);
    const byId = Object.fromEntries(doughs.map((d) => [d.id, d]));
    for (const r of rows) {
      const pid = r.recipes && r.recipes.product_id;
      if (pid) doughFor[pid] = byId[r.ingredient_id];
    }
  }
}
let prodCat = null;
function prodCatOf(p) { return p.isIng ? "半製品" : (p.category || "その他"); }
function itemLabel(p) { return p.isIng ? `${esc(p.name)}〔半製品〕` : esc(p.name); }

function render() {
  $("today").textContent = jpDate(new Date());
  const list = $("list");
  if (!tasks.length) {
    list.innerHTML = '<div class="empty">今日のタスクはまだありません。<br>「＋臨時で仕込む」か「予定登録」から追加できます</div>';
  } else {
    // 旧ボードの区分セクション移植（枠の中は持ち越し→時刻順のまま）
    const SEC = [["仕込み", "🥣"], ["オーダーケーキ", "🎂"], ["プチギフト", "🎁"], ["発送", "📦"]];
    const known = new Set(SEC.map(([k]) => k));
    let html = "";
    for (const [k, icon] of SEC) {
      const rows = tasks.filter((t) => t.task_category === k);
      if (!rows.length) continue;
      html += `<div class="section-label" style="font-size:.95rem;">${icon} ${k}</div>` + rows.map(cardHtml).join("");
    }
    const rest2 = tasks.filter((t) => !known.has(t.task_category));
    if (rest2.length) html += `<div class="section-label" style="font-size:.95rem;">その他</div>` + rest2.map(cardHtml).join("");
    list.innerHTML = html;
  }
  const countable = tasks.filter((t) => t.task_category !== "オーダーケーキ");
  const done = countable.filter((t) => t.status === "完了").length;
  $("pbar").style.width = countable.length ? (done / countable.length) * 100 + "%" : "0%";
  $("plabel").textContent = `${done} / ${countable.length} 完了（オーダーケーキは対象外）`;
}

function cardHtml(t) {
  const cls = t.product_id || t.ingredient_id ? (KUBUN_CLASS[t.task_category] || "sonota")
            : (t.task_category === "仕込み" && !t.product_id ? "sonota" : KUBUN_CLASS[t.task_category] || "sonota");
  const isCake = t.task_category === "オーダーケーキ";
  const doneCls = t.status === "完了" ? " done" : "";
  let badges = "";
  if (t.is_carryover && t.status !== "完了") badges += `<span class="badge carry">${mmdd(t.plan_date)}から持ち越し</span>`;
  if (t.planned_start && t.status !== "完了")
    badges += `<span class="badge time">⏰ ${new Date(t.planned_start).toLocaleTimeString("ja-JP", { hour: "numeric", minute: "2-digit" })}〜</span>`;
  if (t.badge) badges += `<span class="badge time">${esc(t.badge)}</span>`;
  if (t.status === "仕込中") badges += `<span class="badge running">作業中 ${elapsedMin(t)}分</span>`;
  if (t.status === "完了" && t.actual_minutes) badges += `<span class="badge">実績 ${t.actual_minutes}分</span>`;

  const name = esc(t.item_name || "（名称なし）");
  // 仕込みカードのバッチ数はタップで修正可（完了済みなら引落も自動で再計算）
  const editableBatch = t.task_category === "仕込み" && !t.title && t.batch_count != null;
  const batch = !t.title && t.batch_count
    ? (editableBatch
        ? ` <span class="batch-chip" onclick="editBatches('${t.id}')">×${Number(t.batch_count)}バッチ ✎</span>`
        : ` ×${Number(t.batch_count)}バッチ`)
    : "";
  const memo = t.memo ? `<div class="detail">${esc(t.memo)}</div>` : "";
  // 旧ボードの📖レシピ移植：材料表はDBから（切替条件のひとつ）
  const isWeigh = !!(t.title && t.title.endsWith(" 計量"));
  const recipeBtn = t.task_category === "仕込み" && (t.product_id || t.ingredient_id || isWeigh)
    ? `<button class="btn-revert" onclick="openRecipe('${t.id}')">📖 レシピ</button>` : "";

  let row = "";
  if (!isCake) {
    if (t.status === "予定") {
      row = `<div class="row"><button class="btn-start" onclick="doStart('${t.id}')">▶ 開始</button>${recipeBtn}</div>`;
    } else if (t.status === "仕込中") {
      row = `<div class="row">
        <span class="chip ${t.member_id ? "setted" : ""}" onclick="openMember('${t.id}')">担当：${esc(t.member_name || "—")}</span>
        <button class="btn-finish" onclick="doFinish('${t.id}')">✔ 完了</button>
        <button class="btn-revert" onclick="doRevert('${t.id}')">戻す</button>${recipeBtn}</div>`;
    } else {
      const qty = t.completed_quantity != null ? `できあがり ${Number(t.completed_quantity)}個` : "できあがり 予定どおり";
      const qtyChip = t.task_category === "仕込み" && !t.ingredient_id ? `<span class="qty-chip" onclick="editQty('${t.id}')">${qty}</span>` : "";
      row = `<div class="row">${qtyChip}
        <span class="chip ${t.member_id ? "setted" : ""}" onclick="openMember('${t.id}')">担当：${esc(t.member_name || "—")}</span>
        <button class="btn-revert" onclick="doRevert('${t.id}')">戻す</button></div>`;
    }
  }
  return `<div class="card ${cls}${doneCls}">
    <span class="kubun">${esc(t.task_category)}</span>${badges}
    <div class="title">${name}${batch}</div>${memo}${row}</div>`;
}

let recipeData = null;   // 開いているレシピ {items, memo, n}

async function openRecipe(tid) {
  const t = findT(tid);
  if (!t) return;
  $("recipe-title").textContent = `📖 ${t.item_name || "レシピ"}`;
  $("recipe-body").innerHTML = "読み込み中…";
  show("sheet-recipe");
  try {
    let key;
    if (t.product_id) key = `product_id=eq.${t.product_id}`;
    else if (t.ingredient_id) key = `ingredient_id=eq.${t.ingredient_id}`;
    else if (t.title?.endsWith(" 計量")) {
      // 計量タスクは「◯◯ 計量」タイトル行なので、生地名からレシピを引く
      const nm = t.title.slice(0, -3);
      const ing = await rest(`ingredients?name=eq.${encodeURIComponent(nm)}&kind=eq.半製品&select=id&limit=1`);
      if (!ing.length) { $("recipe-body").innerHTML = '<div class="empty">レシピが見つかりません</div>'; return; }
      key = `ingredient_id=eq.${ing[0].id}`;
    } else { $("recipe-body").innerHTML = '<div class="empty">レシピが未登録です</div>'; return; }
    const recs = await rest(`recipes?${key}&is_active=is.true&select=method_memo,recipe_items(amount_g_per_batch,ingredients(name))&limit=1`);
    const r = recs[0];
    if (!r || !r.recipe_items?.length) { $("recipe-body").innerHTML = '<div class="empty">レシピが未登録です</div>'; return; }
    recipeData = {
      items: r.recipe_items.slice().sort((a, b) => b.amount_g_per_batch - a.amount_g_per_batch),
      memo: r.method_memo,
      n: Number(t.batch_count) || 1,
    };
    renderRecipe();
  } catch (e) { $("recipe-body").innerHTML = '<div class="empty">読み込みエラー</div>'; console.error(e); }
}

function setRecipeBatches(n) {
  if (n === "other") {
    const v = prompt("バッチ数");
    if (v === null || v === "" || Number(v) <= 0) return;
    n = Number(v);
  }
  recipeData.n = n;
  renderRecipe();
}

function renderRecipe() {
  const { items, memo, n } = recipeData;
  const total = items.reduce((s2, it) => s2 + Number(it.amount_g_per_batch), 0);
  const chips = [1, 2, 3, 4].map((b) =>
    `<button class="chip ${b === n ? "setted" : ""}" style="margin:0;" onclick="setRecipeBatches(${b})">×${b}</button>`).join(" ")
    + ` <button class="chip ${![1, 2, 3, 4].includes(n) ? "setted" : ""}" style="margin:0;" onclick="setRecipeBatches('other')">${![1, 2, 3, 4].includes(n) ? `×${n}` : "その他"}</button>`;
  $("recipe-body").innerHTML =
    `<div style="display:flex; gap:6px; align-items:center; margin-bottom:8px; flex-wrap:wrap;">
      <span style="font-size:12px; color:#888;">バッチ数</span>${chips}</div>
    <table style="width:100%; border-collapse:collapse; font-size:15px;">
      <tr style="color:#888; font-size:12px;"><th style="text-align:left; padding:4px 2px;">材料</th>
        <th style="text-align:right; padding:4px 2px;">1バッチ</th>
        ${n !== 1 ? `<th style="text-align:right; padding:4px 2px;">×${n}バッチ</th>` : ""}</tr>
      ${items.map((it) => `<tr style="border-top:1px solid #eee;">
        <td style="padding:6px 2px;">${esc(it.ingredients?.name || "?")}</td>
        <td style="text-align:right; padding:6px 2px;">${Number(it.amount_g_per_batch)}g</td>
        ${n !== 1 ? `<td style="text-align:right; padding:6px 2px;"><b>${Math.round(it.amount_g_per_batch * n * 10) / 10}g</b></td>` : ""}</tr>`).join("")}
      <tr style="border-top:2px solid #ddd; font-weight:700;">
        <td style="padding:6px 2px;">合計</td>
        <td style="text-align:right; padding:6px 2px;">${Math.round(total * 10) / 10}g</td>
        ${n !== 1 ? `<td style="text-align:right; padding:6px 2px;">${Math.round(total * n * 10) / 10}g</td>` : ""}</tr>
    </table>` +
    (memo ? `<div class="detail" style="margin-top:10px; white-space:pre-wrap;">${esc(memo)}</div>` : "");
}

function elapsedMin(t) {
  return Math.max(0, Math.floor((Date.now() - new Date(t.actual_start).getTime()) / 60000));
}

/* ---------- 操作（1タップ原則。先に画面を進め、失敗したら戻してトースト） ---------- */

async function act(fn, args, apply) {
  const prev = JSON.parse(JSON.stringify(tasks));
  apply();
  render();
  try { await rpc(fn, args); await load(); }
  catch (e) { tasks = prev; render(); toast("通信エラー：もう一度お試しください"); console.error(e); }
}
const findT = (id) => tasks.find((x) => x.id === id);

function doStart(id) {
  act("fn_start_plan", { p_plan_id: id }, () => {
    const t = findT(id); t.status = "仕込中"; t.actual_start = new Date().toISOString();
  });
}
function doFinish(id) {
  act("fn_finish_plan", { p_plan_id: id }, () => {
    const t = findT(id); t.status = "完了";
    t.actual_minutes = Math.max(1, elapsedMin(t));
  });
}
function doRevert(id) {
  act("fn_revert_plan", { p_plan_id: id }, () => {
    const t = findT(id);
    if (t.status === "完了") { t.status = "仕込中"; t.actual_minutes = null; }
    else { t.status = "予定"; t.actual_start = null; }
  });
}
let batchEditTarget = null; // バッチ数シートの使い回し：nullなら臨時仕込み、入っていれば修正

function editBatches(id) {
  batchEditTarget = id;
  const t = findT(id);
  $("batch-title").textContent = `${t.item_name || ""}：実際に仕込んだバッチ数は？`;
  show("sheet-batch");
}
function editQty(id) {
  const t = findT(id);
  const v = prompt("できあがり個数（予定と違うときだけ）", t.completed_quantity ?? "");
  if (v === null || v === "") return;
  act("fn_set_qty", { p_plan_id: id, p_qty: Number(v) }, () => { t.completed_quantity = Number(v); });
}

/* ---------- 担当者（後追いチップ） ---------- */

function openMember(id) {
  memberTarget = id;
  $("member-grid").innerHTML =
    members.map((m) => `<button onclick="setMember('${m.id}')">${esc(m.display_name)}</button>`).join("") +
    `<button class="other" onclick="setMember(null)">（なし）</button>`;
  show("sheet-member");
}
function setMember(mid) {
  closeSheets();
  const t = findT(memberTarget);
  act("fn_set_member", { p_plan_id: memberTarget, p_member_id: mid }, () => {
    t.member_id = mid;
    t.member_name = mid ? members.find((m) => m.id === mid)?.display_name : null;
  });
}

/* ---------- ＋臨時で仕込む ---------- */

async function openProductSheet() {
  await loadProducts();
  $("product-search").value = "";
  prodCat = null;
  renderProductGrid();
  show("sheet-product");
}
function setProdCat(c) { prodCat = c; renderProductGrid(); }
function renderProductGrid() {
  const cats = [...new Set(products.map(prodCatOf))]
    .sort((a, b) => (a === "半製品") - (b === "半製品") || a.localeCompare(b, "ja"));
  $("product-cats").innerHTML =
    `<button class="${prodCat === null ? "selected" : ""}" onclick="setProdCat(null)">すべて</button>` +
    cats.map((c) => `<button class="${prodCat === c ? "selected" : ""}" onclick="setProdCat('${esc(c)}')">${esc(c)}</button>`).join("");
  const q = $("product-search").value.trim();
  let hits = prodCat ? products.filter((p) => prodCatOf(p) === prodCat) : products;
  if (q) hits = hits.filter((p) => p.name.includes(q));
  let html = hits.slice(0, 40).map((p) => `<button onclick="pickProduct('${p.id}')">${itemLabel(p)}</button>`).join("");
  // 「生地」で探した人への案内（生地は一覧に出さない設計の蓋・genba指摘）
  if (q) {
    html += Object.entries(doughFor)
      .filter(([, d]) => d.name.includes(q))
      .filter(([pid]) => !hits.some((p) => p.id === pid))
      .slice(0, 5)
      .map(([pid, d]) => `<button class="other" onclick="pickProduct('${pid}');pickWork('dough')">🥣 ${esc(d.name)}の仕込み</button>`)
      .join("");
  }
  $("product-grid").innerHTML = html + `<button class="other" onclick="pickOther()">その他（自由入力）</button>`;
}
let pendingWork = null;  // 'dough' | 'bake'
function pickProduct(pid) {
  pendingProduct = products.find((p) => p.id === pid);
  pendingWork = null;
  if (!pendingProduct.isIng && doughFor[pendingProduct.id]) {
    $("work-title").textContent = `${pendingProduct.name}：どっちの作業？`;
    hide("sheet-product"); show("sheet-work");
    return;
  }
  $("batch-title").textContent = `${pendingProduct.name}：バッチ数は？`;
  hide("sheet-product"); show("sheet-batch");
}
function pickWork(w) {
  pendingWork = w;
  const d = doughFor[pendingProduct.id];
  $("batch-title").textContent =
    w === "weigh" ? `${d.name}の計量：何バッチ分？`
    : w === "dough" ? `${d.name}の仕込み：何バッチ？`
    : `${pendingProduct.name}の焼成：何バッチ？`;
  hide("sheet-work"); show("sheet-batch");
}
async function quickAdd(n) {
  if (batchEditTarget) { // 修正モード：引落も自動で再計算される（fn_set_batches）
    const id = batchEditTarget;
    closeSheets();
    act("fn_set_batches", { p_plan_id: id, p_batches: n }, () => { findT(id).batch_count = n; });
    return;
  }
  closeSheets();
  try {
    const doughId = pendingWork === "dough" ? doughFor[pendingProduct.id].id : null;
    if (pendingWork === "weigh") {
      // 計量＝記録だけのタスク（在庫は仕込み完了で動かすので二重計上しない）
      const tid = await rpc("fn_my_tenant_id");
      await insert("production_plans", {
        tenant_id: tid, plan_date: todayStr(), task_category: "仕込み",
        title: `${doughFor[pendingProduct.id].name} 計量`, batch_count: n, source: "app",
      });
    } else if (pendingProduct.isIng || doughId) {
      // 半製品・生地はfn_quick_planが未対応なので直接insert（RLS越し・当日の予定として登録）
      const tid = await rpc("fn_my_tenant_id");
      await insert("production_plans", {
        tenant_id: tid, plan_date: todayStr(), task_category: "仕込み",
        ingredient_id: doughId || pendingProduct.id, batch_count: n, source: "app",
      });
    } else {
      await rpc("fn_quick_plan", { p_product_id: pendingProduct.id, p_batches: n });
    }
    await load();
  } catch (e) { toast("登録に失敗しました"); console.error(e); }
}
function quickAddOther() {
  const v = prompt("バッチ数");
  if (v === null || v === "" || Number(v) <= 0) { closeSheets(); return; }
  quickAdd(Number(v));
}
async function pickOther() {
  const v = prompt("何を仕込む？（自由入力）");
  closeSheets();
  if (!v) return;
  try {
    await rpc("fn_quick_plan", { p_title: v });
    await load();
  } catch (e) { toast("登録に失敗しました"); console.error(e); }
}

function show(id) { $("sheetbg").style.display = "block"; $(id).style.display = "block"; }
function hide(id) { $(id).style.display = "none"; }
function closeSheets() {
  for (const id of ["sheet-product", "sheet-work", "sheet-batch", "sheet-member", "sheet-recipe"]) hide(id);
  $("sheetbg").style.display = "none";
  batchEditTarget = null;
}

/* ---------- 起動・60秒自動更新（看板モード＝genba確定値） ---------- */

if (requireLogin()) {
  load().catch((e) => { $("list").innerHTML = `<div class="empty">読み込みエラー：${esc(e.message)}</div>`; });
  setInterval(() => load().catch(() => {}), 60000);
  setInterval(render, 30000); // 経過時間バッジの更新
}
</script>
</body>
</html>
