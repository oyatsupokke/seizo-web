<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>レシピをみる — 製造管理</title>
<link rel="stylesheet" href="app.css">
<style>
  .p-row{display:flex; align-items:center; gap:8px; background:#fff; border-radius:10px; padding:12px; margin:6px 0; cursor:pointer;}
  .p-row .nm{flex:1; min-width:0; overflow-wrap:anywhere; font-size:.95rem;}
  .p-row .nm .kiji{color:#5b3fa8; font-weight:700;}
  .p-row .cat{flex:0 0 auto; font-size:.72rem; color:#777; background:#f4f1ea; border-radius:6px; padding:2px 7px;}
</style>
</head>
<body>
<header>
  <h1>レシピをみる</h1>
  <div class="nav"><a href="index.html">📝 今日やること</a><a href="recipe.html">📖 レシピ登録</a></div>
</header>
<main>
  <input type="text" id="search" placeholder="商品名・生地名で検索" autocomplete="off" oninput="renderList()">
  <div class="cat-chips" id="cats" style="margin-top:8px"></div>
  <div class="hint" style="font-size:.78rem; color:#888; margin:6px 0;">見るだけの画面です（ここからは変更されません）。直すときは「📖 レシピ登録」へ</div>
  <div id="list"><div class="empty">読み込み中…</div></div>
</main>

<div class="sheet-bg" id="sheetbg" onclick="closeSheet()"></div>
<div class="sheet" id="sheet-recipe">
  <h2 id="recipe-title">📖 レシピ</h2>
  <div id="recipe-body"></div>
  <div class="row" style="margin-top:14px;">
    <button style="flex:1; background:#eee" onclick="closeSheet()">とじる</button>
  </div>
</div>

<script src="api.js?v=20260824c"></script>
<script>
let entries = [];   // {key, name, category, isIng}
let selCat = "";

async function load(){
  const rs = await rest("recipes?is_active=is.true&select=product_id,ingredient_id,products(name,category),ingredients(name,category)&limit=1000");
  entries = rs.map((r) => r.product_id
    ? { key: `product_id=eq.${r.product_id}`, name: r.products?.name || "?", category: r.products?.category || "", isIng: false }
    : { key: `ingredient_id=eq.${r.ingredient_id}`, name: r.ingredients?.name || "?", category: r.ingredients?.category || "半製品", isIng: true })
    .sort((a, b) => a.name.localeCompare(b.name, "ja"));
  renderCats();
  renderList();
}

function norm(s){ return (s||"").normalize("NFKC").replace(/[\s　]/g,"").replace(/[ぁ-ゖ]/g,(c)=>String.fromCharCode(c.charCodeAt(0)+0x60)); }

function renderCats(){
  const cats = [...new Set(entries.map((e) => e.category).filter(Boolean))].sort((a,b)=>a.localeCompare(b,"ja"));
  $("cats").innerHTML = `<button class="${selCat===""?"selected":""}" onclick="setCat('')">すべて</button>` +
    cats.map((c) => `<button class="${selCat===c?"selected":""}" onclick="setCat('${esc(c)}')">${esc(c)}</button>`).join("");
}
function setCat(c){ selCat = c; renderCats(); renderList(); }

function renderList(){
  const q = norm($("search").value.trim());
  let list = entries;
  if (selCat) list = list.filter((e) => e.category === selCat);
  if (q) list = list.filter((e) => norm(e.name).includes(q));
  $("list").innerHTML = list.slice(0, 100).map((e, i) =>
    `<div class="p-row" onclick="openRecipe(${entries.indexOf(e)})">
      <div class="nm">${e.isIng ? '<span class="kiji">〔半製品〕</span> ' : ""}${esc(e.name)}</div>
      ${e.category ? `<div class="cat">${esc(e.category)}</div>` : ""}
    </div>`).join("") || '<div class="empty">見つかりません（レシピ未登録かも。登録は「📖 レシピ登録」から）</div>';
}

/* ---------- レシピ表示（index.htmlの📖シートと同じ描画・×バッチ計算） ---------- */

let recipeData = null;

function show(id){ $("sheetbg").style.display = "block"; $(id).style.display = "block"; }
function closeSheet(){ $("sheetbg").style.display = "none"; $("sheet-recipe").style.display = "none"; }

async function openRecipe(idx){
  const e = entries[idx];
  if (!e) return;
  $("recipe-title").textContent = `📖 ${e.name}`;
  $("recipe-body").innerHTML = "読み込み中…";
  show("sheet-recipe");
  try {
    const recs = await rest(`recipes?${e.key}&is_active=is.true&select=method_memo,recipe_items(amount_g_per_batch,ingredients(name))&limit=1`);
    const r = recs[0];
    if (!r || !r.recipe_items?.length){ $("recipe-body").innerHTML = '<div class="empty">レシピが未登録です</div>'; return; }
    recipeData = {
      items: r.recipe_items.slice().sort((a, b) => b.amount_g_per_batch - a.amount_g_per_batch),
      memo: r.method_memo,
      n: 1,
    };
    renderRecipe();
  } catch (err){ $("recipe-body").innerHTML = '<div class="empty">読み込みエラー</div>'; console.error(err); }
}

function setRecipeBatches(n){
  if (n === "other"){
    const v = prompt("バッチ数");
    if (v === null || v === "" || Number(v) <= 0) return;
    n = Number(v);
  }
  recipeData.n = n;
  renderRecipe();
}

function renderRecipe(){
  const { items, memo, n } = recipeData;
  const total = items.reduce((s2, it) => s2 + Number(it.amount_g_per_batch), 0);
  const chips = [1, 2, 3, 4].map((b) =>
    `<button class="chip ${b === n ? "setted" : ""}" style="margin:0;" onclick="setRecipeBatches(${b})">×${b}</button>`).join(" ")
    + ` <button class="chip ${![1, 2, 3, 4].includes(n) ? "setted" : ""}" style="margin:0;" onclick="setRecipeBatches('other')">${![1, 2, 3, 4].includes(n) ? `×${n}` : "その他"}</button>`;
  $("recipe-body").innerHTML =
    `<div style="display:flex; gap:6px; align-items:center; margin-bottom:8px; flex-wrap:wrap;">
      <span style="font-size:12px; color:#888;">バッチ数</span>${chips}</div>
    <table style="width:100%; border-collapse:collapse; font-size:15px;">
      <tr style="color:#888; font-size:12px;"><th style="text-align:left; padding:4px 2px;">材料</th>
        <th style="text-align:right; padding:4px 2px;">1バッチ</th>
        ${n !== 1 ? `<th style="text-align:right; padding:4px 2px;">×${n}バッチ</th>` : ""}</tr>
      ${items.map((it) => `<tr style="border-top:1px solid #eee;">
        <td style="padding:6px 2px;">${esc(it.ingredients?.name || "?")}</td>
        <td style="text-align:right; padding:6px 2px;">${Number(it.amount_g_per_batch)}g</td>
        ${n !== 1 ? `<td style="text-align:right; padding:6px 2px;"><b>${Math.round(it.amount_g_per_batch * n * 10) / 10}g</b></td>` : ""}</tr>`).join("")}
      <tr style="border-top:2px solid #ddd; font-weight:700;">
        <td style="padding:6px 2px;">合計</td>
        <td style="text-align:right; padding:6px 2px;">${Math.round(total * 10) / 10}g</td>
        ${n !== 1 ? `<td style="text-align:right; padding:6px 2px;">${Math.round(total * n * 10) / 10}g</td>` : ""}</tr>
    </table>` +
    (memo ? `<div class="detail" style="margin-top:10px; white-space:pre-wrap;">${esc(memo)}</div>` : "");
}

if (requireLogin()) load().catch((e)=>{ console.error(e); });
</script>
</body>
</html>
