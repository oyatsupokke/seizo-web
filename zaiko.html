<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>在庫・発注 — 製造管理</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<header>
  <h1>在庫・発注</h1>
  <div class="date" id="today"></div>
  <div class="nav">
    <a href="index.html">🏠 今日やること</a>
    <a href="tanaoroshi.html">📋 棚卸</a>
  </div>
</header>
<main>
  <div id="temp-ing" style="display:none; background:#fdf3e0; color:#b26a00; border-radius:10px; padding:10px 12px; font-size:.88rem; font-weight:700; margin:8px 0;"></div>
  <div id="po-section"></div>
  <div class="section-label">アラート</div>
  <div id="alerts"><div class="empty">読み込み中…</div></div>

  <div class="section-label">材料をさがす（現在庫・予測）</div>
  <input type="text" id="search" placeholder="材料名で検索（例：バター）" oninput="renderSearch()">
  <div id="search-result"></div>

  <div id="uncovered"></div>
</main>
<div class="fab" onclick="openArrivalSheet()">📦 入荷を記録</div>

<div class="sheet-bg" id="sheetbg" onclick="closeSheets()"></div>
<div class="sheet" id="sheet-arrival-pick">
  <h2>何が入荷した？（連続で記録できます）</h2>
  <div id="arrival-today"></div>
  <input type="text" id="arrival-search" placeholder="材料名で検索" oninput="renderArrivalList()">
  <div class="grid" id="arrival-grid" style="margin-top:10px;"></div>
</div>
<div class="sheet" id="sheet-arrival-qty">
  <h2 id="arrival-title">数量は？</h2>
  <div class="qty-row">
    <input type="number" id="arrival-qty" inputmode="decimal" step="0.5" min="0">
    <span class="unit-label" id="arrival-unit"></span>
  </div>
  <div class="hint" id="arrival-hint"></div>
  <div class="row">
    <button class="btn-finish" onclick="saveArrival()">✔ 入荷を記録</button>
    <button class="btn-revert" onclick="backToPick()">← 材料選択に戻る</button>
  </div>
</div>
<div class="sheet" id="sheet-order-qty">
  <h2 id="order-title">発注した数量は？</h2>
  <div class="qty-row">
    <input type="number" id="order-qty" inputmode="decimal" step="0.5" min="0">
    <span class="unit-label" id="order-unit"></span>
  </div>
  <div class="hint" id="order-hint"></div>
  <div class="row">
    <button class="btn-finish" onclick="saveOrder()">✔ 発注を記録</button>
  </div>
</div>
<div class="toast" id="toast"></div>

<script src="api.js"></script>
<script>
let alerts = [], stock = [], lastArrival = {}, pendingIng = null;
let todayArrivals = [];   // 今日記録した入荷 [{id, ingredient_id, grams}]（取消用）
let myTenantId = null;
let toastTimer = null;

function toast(msg, undoFn) {
  const t = $("toast");
  t.innerHTML = esc(msg) + (undoFn ? ' <button class="toast-undo" onclick="toastUndo()">取消</button>' : "");
  t.classList.toggle("clickable", !!undoFn);
  window._toastUndo = undoFn || null;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), undoFn ? 6000 : 2500);
}
async function toastUndo() {
  $("toast").classList.remove("show");
  if (window._toastUndo) { const f = window._toastUndo; window._toastUndo = null; await f(); }
}

let openPOs = [];        // 発注済み・未入荷
let lastOrder = {};      // ingredient_id -> {qty, unit}（発注数量のデフォルト用）
let busyPOs = new Set(); // 二度押し防止。DB側も冪等なので通信再送でも二重入荷しない

async function load() {
  const [a, s, units, la, un, pos, recentPos] = await Promise.all([
    rest("v_order_alerts?select=*&order=alert_kind.desc,order_by_date"),
    rest("v_projected_stock?select=*&order=name"),
    // v_projected_stockに発注単位の列が無いのでingredientsから補完
    rest("ingredients?is_active=eq.true&select=id,order_unit,order_unit_to_g"),
    rest("v_last_arrival?select=*"),
    rest("v_uncovered_plans?select=*&order=plan_date.desc"),
    rest("purchase_orders?status=eq.発注済&select=*&order=ordered_on"),
    rest("purchase_orders?status=in.(発注済,入荷済)&select=ingredient_id,quantity,quantity_unit,ordered_on&order=ordered_on.desc&limit=200"),
  ]);
  openPOs = pos;
  lastOrder = {};
  for (const p of recentPos) {
    if (!lastOrder[p.ingredient_id]) lastOrder[p.ingredient_id] = { qty: p.quantity, unit: p.quantity_unit };
  }
  const unitMap = Object.fromEntries(units.map((u) => [u.id, u]));
  alerts = a;
  stock = s.map((row) => ({ ...row, ...(unitMap[row.ingredient_id] || {}) }));
  lastArrival = Object.fromEntries(la.map((x) => [x.ingredient_id, { g: x.last_amount_g, at: x.occurred_at }]));
  if (!myTenantId) myTenantId = await rpc("fn_my_tenant_id");
  // 今日記録済みの入荷（リロードしても取消・✔表示が続くように）
  todayArrivals = (await rest(`inventory_transactions?kind=eq.入荷&occurred_at=gte.${todayStr()}&select=id,ingredient_id,delta_g,source_purchase_order_id&order=occurred_at.desc`))
    .map((t) => ({
      id: t.id, ingredient_id: t.ingredient_id, grams: t.delta_g,
      purchaseOrderId: t.source_purchase_order_id,
    }));
  renderPOs();
  renderAlerts();
  renderSearch();
  renderUncovered(un);
  renderTempIng();
}

// レシピ画面で仮登録された材料（単価未設定）をまりほが毎日見る場所に出す（genba：見に行く場所を増やしたら負け）
async function renderTempIng() {
  try {
    const t = await rest("ingredients?category=eq.未分類&is_active=eq.true&select=name&order=created_at.desc");
    const el = $("temp-ing");
    if (!t.length) { el.style.display = "none"; return; }
    el.style.display = "block";
    el.style.cursor = "pointer";
    el.onclick = () => location.href = "zairyo.html?filter=noprice";
    el.textContent = `⚠ 単価未設定の材料 ${t.length}件（レシピ画面で仮登録）：${t.map((x) => x.name).join("・")} — タップして材料マスタで設定`;
  } catch {}
}

/* ---------- 発注済み一覧（届いたらチェック） ---------- */

const daysAgo = (iso) => Math.floor((new Date(todayStr()) - new Date(iso)) / 86400000);

function renderPOs() {
  const el = $("po-section");
  if (!openPOs.length) { el.innerHTML = ""; return; }
  el.innerHTML = `<div class="section-label">発注済み（届いたらチェック）</div>` +
    openPOs.map((po) => {
      const ing = ingOf(po.ingredient_id);
      const stale = po.ordered_on && daysAgo(po.ordered_on) >= 5;
      const qty = `${Number(po.quantity)}${po.quantity_unit || "g"}`;
      return `<div class="alert-row po-row${stale ? " alert-yellow" : ""}">
        <div class="alert-main" onclick="editPOQty('${po.id}')">
          <div class="alert-name">${esc(ing?.name || "？")} ${qty}</div>
          <div class="alert-sub">${po.ordered_on ? mmdd(po.ordered_on) + "発注" : ""}${stale ? "・<b>届いていませんか？</b>" : ""}（数量が違えばタップで修正）</div>
        </div>
        <button class="btn-arrive" onclick="poArrived('${po.id}')" ${busyPOs.has(po.id) ? "disabled" : ""}>${busyPOs.has(po.id) ? "反映中…" : "✔ 届いた"}</button>
        <button class="btn-revert" onclick="poCancel('${po.id}')">取消</button>
      </div>`;
    }).join("");
}

function poGrams(po, ing) {
  // 発注単位が材料の発注単位と一致すればg換算、'g'ならそのまま
  if (po.quantity_unit && po.quantity_unit !== "g" && ing?.order_unit_to_g > 0) return po.quantity * ing.order_unit_to_g;
  return po.quantity;
}

async function poArrived(poId) {
  const po = openPOs.find((p) => p.id === poId);
  if (!po || busyPOs.has(poId)) return;
  const ing = ingOf(po.ingredient_id);
  busyPOs.add(poId);
  renderPOs();
  try {
    const result = await rpc("fn_receive_purchase_order", { p_purchase_order_id: poId });
    toast(`${ing?.name || ""} ${fmtAmount(ing, result.amount_g)} 入荷を記録しました`, async () => {
      if (!confirm("この入荷記録を取り消しますか？\n在庫も入荷前の量に戻ります。")) return;
      try {
        await rpc("fn_revert_purchase_order_arrival", { p_purchase_order_id: poId });
        toast("入荷記録を取り消しました");
        await load();
      } catch (e) {
        toast("取消は反映されていません。もう一度お試しください");
        console.error(e);
      }
    });
    await load();
  } catch (e) {
    toast("入荷は反映されていません。もう一度お試しください");
    console.error(e);
  } finally {
    busyPOs.delete(poId);
    renderPOs();
  }
}

async function poCancel(poId) {
  try {
    await apiFetch(`/rest/v1/purchase_orders?id=eq.${poId}`, { method: "PATCH", body: JSON.stringify({ status: "取消" }) });
    toast("発注を取り消しました", async () => {
      await apiFetch(`/rest/v1/purchase_orders?id=eq.${poId}`, { method: "PATCH", body: JSON.stringify({ status: "発注済" }) });
      load().catch(() => {});
    });
    load().catch(() => {});
  } catch (e) { toast("取消に失敗しました"); console.error(e); }
}

function editPOQty(poId) {
  const po = openPOs.find((p) => p.id === poId);
  if (!po) return;
  const ing = ingOf(po.ingredient_id);
  const v = prompt(`${ing?.name || ""}：実際の数量（${po.quantity_unit || "g"}）`, po.quantity);
  if (v === null || v === "" || Number(v) <= 0) return;
  apiFetch(`/rest/v1/purchase_orders?id=eq.${poId}`, { method: "PATCH", body: JSON.stringify({ quantity: Number(v) }) })
    .then(() => load())
    .catch((e) => { toast("修正に失敗しました"); console.error(e); });
}

/* ---------- 発注の記録（アラート行・検索行から1タップ起点） ---------- */

let orderIng = null;

function openOrder(id) {
  orderIng = ingOf(id);
  if (!orderIng) return;
  const useUnit = orderIng.order_unit && orderIng.order_unit_to_g > 0;
  $("order-title").textContent = `${orderIng.name}：発注した数量は？`;
  $("order-unit").textContent = useUnit ? orderIng.order_unit : "g";
  $("order-qty").step = useUnit ? "1" : "0.5";
  const last = lastOrder[orderIng.ingredient_id];
  const lastArr = lastArrival[orderIng.ingredient_id]?.g;
  let def = "";
  let fromLast = false;
  if (last && (last.unit || "g") === (useUnit ? orderIng.order_unit : "g")) { def = Number(last.qty); fromLast = true; }
  // 発注単位ものは端数を提案しない（半袋の発注はありえない）。前回発注が無ければ1袋。
  else if (useUnit) def = 1;
  else if (lastArr != null) { def = Math.round(lastArr); fromLast = true; }
  $("order-qty").value = def;
  $("order-hint").textContent = fromLast
    ? "前回と同じ量を入れてあります（違えば直してください）"
    : (useUnit ? `1${orderIng.order_unit} = ${orderIng.order_unit_to_g}g` : "グラムで入力してください");
  show("sheet-order-qty");
  $("order-qty").focus();
}

async function saveOrder() {
  const v = Number($("order-qty").value);
  if (!v || v <= 0) { toast("数量を入れてください"); return; }
  const useUnit = orderIng.order_unit && orderIng.order_unit_to_g > 0;
  try {
    const rows = await insert("purchase_orders", [{
      tenant_id: myTenantId, ingredient_id: orderIng.ingredient_id,
      quantity: v, quantity_unit: useUnit ? orderIng.order_unit : "g",
      ordered_on: todayStr(), status: "発注済",
    }]);
    const poId = rows[0].id;
    closeSheets();
    toast(`${orderIng.name} ${v}${useUnit ? orderIng.order_unit : "g"} 発注を記録しました`, async () => {
      await apiFetch(`/rest/v1/purchase_orders?id=eq.${poId}`, { method: "DELETE" });
      load().catch(() => {});
    });
    load().catch(() => {});
  } catch (e) { toast("記録に失敗しました"); console.error(e); }
}

/* ---------- 表示ユーティリティ：gを発注単位に換算して読みやすく ---------- */

function ingOf(id) { return stock.find((s) => s.ingredient_id === id); }

function fmtAmount(ing, g) {
  if (g == null) return "—";
  if (ing?.order_unit && ing?.order_unit_to_g > 0) {
    const n = g / ing.order_unit_to_g;
    const r = Math.round(n * 10) / 10;
    return `${r}${ing.order_unit}（${Math.round(g)}g）`;
  }
  return `${Math.round(g)}g`;
}

/* ---------- アラート（不足=赤・下限=黄） ---------- */

function renderAlerts() {
  const el = $("alerts");
  if (!alerts.length) {
    el.innerHTML = '<div class="empty" style="padding:20px;">アラートはありません</div>';
    return;
  }
  el.innerHTML = alerts.map((a) => {
    const ing = ingOf(a.ingredient_id);
    const cls = a.alert_kind === "不足" ? "alert-red" : "alert-yellow";
    const when = a.alert_kind === "不足"
      ? `${mmdd(a.runout_date)} に不足`
      : (a.kind === "購入材料" ? "発注点を下回り・早めに発注" : "残りが少なめ・早めに仕込み");
    // 下限のorder_by_dateは定義上つねに過去日になるので不足のみ表示
    const orderBy = a.alert_kind === "不足" && a.order_by_date && a.kind === "購入材料"
      ? `／${mmdd(a.order_by_date)}までに発注` : "";
    return `<div class="alert-row ${cls}">
      <div class="alert-main">
        <div class="alert-name">${esc(a.name)}</div>
        <div class="alert-sub">予測 ${fmtAmount(ing, a.projected_g)}・${when}${orderBy}</div>
      </div>
      ${a.kind === "購入材料"
        ? `<button class="btn-arrive" onclick="openOrder('${a.ingredient_id}')">発注を記録</button>`
        : `<span class="tag-shikomi">仕込む</span>`}
    </div>`;
  }).join("");
}

/* ---------- 材料検索 → 現在庫・予測推移（テキスト） ---------- */

async function renderSearch() {
  const q = $("search").value.trim();
  const el = $("search-result");
  if (!q) { el.innerHTML = ""; return; }
  const hits = stock.filter((s) => s.name.includes(q)).slice(0, 10);
  if (!hits.length) { el.innerHTML = '<div class="empty" style="padding:16px;">見つかりません</div>'; return; }
  el.innerHTML = hits.map((s) => `<div class="stock-row">
      <div class="stock-row-top" onclick="showDetail('${s.ingredient_id}', this)">
        <div style="flex:1; min-width:0;">
          <div class="alert-name">${esc(s.name)}</div>
          <div class="alert-sub">現在庫 ${fmtAmount(s, s.current_g)} → 予測 ${fmtAmount(s, s.projected_g)}</div>
        </div>
        ${s.kind === "購入材料" ? `<button class="btn-arrive" onclick="event.stopPropagation();openOrder('${s.ingredient_id}')">発注を記録</button>` : ""}
      </div>
      <div class="stock-detail" id="detail-${s.ingredient_id}"></div>
    </div>`).join("");
}

async function showDetail(id, row) {
  const el = $("detail-" + id);
  if (el.innerHTML) { el.innerHTML = ""; return; }
  el.innerHTML = "読み込み中…";
  try {
    const plans = await rest(`v_planned_consumption?ingredient_id=eq.${id}&select=plan_date,planned_g&order=plan_date`);
    const s = ingOf(id);
    const lines = plans.map((p) => `${mmdd(p.plan_date)} の仕込みで −${Math.round(p.planned_g)}g`);
    if (s?.incoming_g > 0) lines.push(`入荷予定 +${Math.round(s.incoming_g)}g`);
    el.innerHTML = lines.length ? lines.map(esc).join("<br>") : "今後の予定消費はありません";
  } catch { el.innerHTML = "取得エラー"; }
}

/* ---------- レシピ未登録のまま完了した仕込み（穴の見える化） ---------- */

function renderUncovered(un) {
  const el = $("uncovered");
  if (!un.length) { el.innerHTML = ""; return; }
  const names = [...new Set(un.map((u) => u.item_name))];
  el.innerHTML = `<div class="section-label">⚠ 引落なしで完了した仕込み（今月 ${un.length}件）</div>
    <div class="uncovered-box">レシピ未登録のため在庫が引かれていません：${esc(names.join("・"))}</div>`;
}

/* ---------- 入荷の記録（夕方まとめて連続入力・前回量デフォルト） ---------- */

function openArrivalSheet() {
  $("arrival-search").value = "";
  renderArrivalList();
  show("sheet-arrival-pick");
}

function renderArrivalList() {
  const q = $("arrival-search").value.trim();
  // 購入材料のみ（半製品の入庫は仕込み完了で自動計上される）
  let list = stock.filter((s) => s.kind === "購入材料");
  if (q) list = list.filter((s) => s.name.includes(q));
  const arrivedIds = todayArrivals.map((t) => t.ingredient_id);
  // 並び順：前回入荷が新しい順（定期便の材料が上位に固定され、数回使えばほぼ無検索で回る）
  list.sort((a, b) => {
    const ta = lastArrival[a.ingredient_id]?.at, tb = lastArrival[b.ingredient_id]?.at;
    if (!!tb - !!ta) return !!tb - !!ta;
    if (ta && tb && ta !== tb) return tb.localeCompare(ta);
    return a.name.localeCompare(b.name, "ja");
  });
  // 今日記録した分の一覧（行ごとに取消できる＝入れ間違いの救済）
  const todayHtml = todayArrivals.length
    ? `<div class="section-label" style="margin-top:0;">今日記録した入荷</div>` +
      todayArrivals.map((t) => {
        const ing = ingOf(t.ingredient_id);
        return `<div class="today-arrival-row">✔ ${esc(ing?.name || "？")} ${fmtAmount(ing, t.grams)}
          <button class="btn-revert" onclick="deleteArrival('${t.id}')">取消</button></div>`;
      }).join("")
    : "";
  $("arrival-today").innerHTML = todayHtml;
  $("arrival-grid").innerHTML = list.slice(0, 30).map((s) =>
    `<button onclick="pickIngredient('${s.ingredient_id}')">${arrivedIds.includes(s.ingredient_id) ? "✔ " : ""}${esc(s.name)}</button>`
  ).join("") || '<div class="empty">見つかりません</div>';
}

async function deleteArrival(txId) {
  const arrival = todayArrivals.find((t) => t.id === txId);
  if (arrival?.purchaseOrderId) {
    if (!confirm("この入荷記録を取り消しますか？\n発注済みの状態に戻り、在庫も入荷前の量に戻ります。")) return;
    try {
      await rpc("fn_revert_purchase_order_arrival", { p_purchase_order_id: arrival.purchaseOrderId });
      toast("入荷の記録を取り消しました");
      await load();
    } catch (e) {
      toast("取消は反映されていません。もう一度お試しください");
      console.error(e);
    }
    return;
  }
  try {
    await rpc("fn_delete_manual_arrival", { p_transaction_id: txId });
    todayArrivals = todayArrivals.filter((t) => t.id !== txId);
    renderArrivalList();
    toast("入荷の記録を取り消しました");
    load().catch(() => {});
  } catch (e) {
    toast("取消は反映されていません。棚卸確定後の入荷は取り消せません");
    console.error(e);
  }
}

function pickIngredient(id) {
  pendingIng = ingOf(id);
  if (!pendingIng) return;
  $("arrival-title").textContent = `${pendingIng.name}：数量は？`;
  const useUnit = pendingIng.order_unit && pendingIng.order_unit_to_g > 0;
  $("arrival-unit").textContent = useUnit ? pendingIng.order_unit : "g";
  const lastG = lastArrival[id]?.g;
  const input = $("arrival-qty");
  input.value = lastG != null
    ? (useUnit ? Math.round((lastG / pendingIng.order_unit_to_g) * 10) / 10 : Math.round(lastG))
    : "";
  $("arrival-hint").textContent = lastG != null
    ? `前回の入荷と同じ量を入れてあります（前回 ${fmtAmount(pendingIng, lastG)}）`
    : (useUnit ? `1${pendingIng.order_unit} = ${pendingIng.order_unit_to_g}g` : "グラムで入力してください");
  hide("sheet-arrival-pick");
  show("sheet-arrival-qty");
  input.focus();
}

async function saveArrival() {
  const v = Number($("arrival-qty").value);
  if (!v || v <= 0) { toast("数量を入れてください"); return; }
  const useUnit = pendingIng.order_unit && pendingIng.order_unit_to_g > 0;
  const grams = useUnit ? v * pendingIng.order_unit_to_g : v;
  try {
    // 直接insert（idが返る＝トーストの「取消」で1タップ削除できる）
    const rows = await insert("inventory_transactions", [{
      tenant_id: myTenantId, ingredient_id: pendingIng.ingredient_id, delta_g: grams, kind: "入荷",
    }]);
    const txId = rows[0].id;
    lastArrival[pendingIng.ingredient_id] = { g: grams, at: new Date().toISOString() };
    todayArrivals.unshift({ id: txId, ingredient_id: pendingIng.ingredient_id, grams });
    toast(`${pendingIng.name} ${fmtAmount(pendingIng, grams)} 入荷を記録しました`, () => deleteArrival(txId));
    // 連続入力：材料選択に戻る（納品書を見ながら次々入れる運用）
    backToPick();
    load().catch(() => {});
  } catch (e) { toast("記録に失敗しました"); console.error(e); }
}

function backToPick() {
  hide("sheet-arrival-qty");
  $("arrival-search").value = "";
  renderArrivalList();
  show("sheet-arrival-pick");
}

function show(id) { $("sheetbg").style.display = "block"; $(id).style.display = "block"; }
function hide(id) { $(id).style.display = "none"; }
function closeSheets() {
  for (const id of ["sheet-arrival-pick", "sheet-arrival-qty", "sheet-order-qty"]) hide(id);
  $("sheetbg").style.display = "none";
}

if (requireLogin()) {
  $("today").textContent = jpDate(new Date());
  load().catch((e) => { $("alerts").innerHTML = `<div class="empty">読み込みエラー：${esc(e.message)}</div>`; });
}
</script>
</body>
</html>
