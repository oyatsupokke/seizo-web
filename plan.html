<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>予定登録・一覧 — 製造管理</title>
<link rel="stylesheet" href="app.css">
<style>
  .week-day{margin:14px 0 4px; font-size:.9rem; font-weight:700; color:#555;}
  .week-day.today{color:var(--c-shikomi);}
  .mini-card{background:#fff; border-radius:10px; padding:8px 12px; margin:6px 0; font-size:.9rem; border-left:6px solid #ccc; display:flex; justify-content:space-between; align-items:center; gap:8px;}
  .mini-card .del{color:#d94141; font-size:.8rem; text-decoration:underline; cursor:pointer; flex:0 0 auto;}
  .mini-card.st-done{opacity:.5;}
  .wk-nav{display:flex; gap:8px; align-items:center; margin:10px 0;}
  .wk-nav button{flex:0 0 auto; padding:8px 16px; font-size:.9rem; background:#efeaf9; color:var(--c-shikomi);}
  .wk-nav .label{flex:1; text-align:center; font-weight:700; font-size:.9rem;}
  .free-mark{background:#fdf3e0; color:#b26a00; font-size:.7rem; border-radius:6px; padding:1px 6px; font-weight:700;}
  .combo{display:flex; gap:6px;}
  .combo-toggle{flex:0 0 52px; background:#efeaf9; color:#5b3fa8; font-size:1rem; border-radius:10px;}
  .combo-panel{background:#fff; border:1px solid #ddd; border-radius:10px; margin-top:6px; max-height:45vh; overflow-y:auto; padding:8px;}
  .combo-list button{display:block; width:100%; text-align:left; background:#f9f7f3; margin:5px 0; padding:11px 12px; font-weight:400; font-size:.95rem; border-radius:8px;}
  .combo-list button.free{background:#fdf3e0; color:#b26a00; font-weight:700;}
  .combo-list .none{color:#888; font-size:.85rem; padding:8px 4px;}
</style>
</head>
<body>
<header>
  <h1>予定登録・一覧</h1>
  <div class="nav"><a href="index.html">🏠 今日やること</a></div>
</header>
<main>
  <form id="form">
    <label>日付</label>
    <input type="date" id="f-date" required>
    <label>区分</label>
    <div class="seg" id="f-kubun"></div>
    <label>商品</label>
    <div class="combo">
      <input type="text" id="f-search" placeholder="タップして一覧から選ぶ／打つと絞り込み" autocomplete="off">
      <button type="button" class="combo-toggle" id="f-toggle">▾</button>
    </div>
    <div class="combo-panel" id="f-panel" style="display:none">
      <div class="picker-hint">こねる＝<b>生地｜◯◯</b>　／　焼く＝<b>◯◯</b></div>
      <div class="cat-chips" id="f-cats"></div>
      <div class="combo-list" id="f-list"></div>
    </div>
    <div class="bind-state" id="f-bind"></div>
    <div class="detail" id="f-yield" style="margin:6px 2px"></div>
    <label>バッチ数</label>
    <input type="number" id="f-batch" value="1" min="0.5" step="0.5">
    <label>メモ（任意）</label>
    <input type="text" id="f-memo">
    <div style="margin-top:18px"><button class="btn-primary" type="submit">登録する</button></div>
    <p id="f-msg" style="font-size:.85rem; color:var(--c-gift); font-weight:700;"></p>
  </form>

  <div class="section-label" style="font-size:1rem; margin-top:28px">📅 週の予定</div>
  <div class="wk-nav">
    <button onclick="moveWeek(-1)">← 前の週</button>
    <div class="label" id="wk-label"></div>
    <button onclick="moveWeek(1)">次の週 →</button>
  </div>
  <div id="week"></div>
</main>
<div class="toast" id="toast"></div>

<script src="api.js"></script>
<script>
const KUBUNS = ["仕込み", "オーダーケーキ", "プチギフト", "発送"];
let products = [], hanseihin = [], selProduct = null, selKubun = "仕込み", weekStart = null;

// 区分=仕込みのときだけ半製品も候補に出す（半製品の仕込み＝製造入庫の起点なので紐づけ必須）
function candidates() {
  return selKubun === "仕込み" ? [...products, ...hanseihin] : products;
}

// 表記ゆれを吸収して比較（全角/半角・ひらがな→カタカナ・空白除去。genba指定：厳密一致だと安全網が発動しない）
function norm(s) {
  return (s || "").normalize("NFKC").replace(/[\s　]/g, "")
    .replace(/[ぁ-ゖ]/g, (c) => String.fromCharCode(c.charCodeAt(0) + 0x60));
}
function exactMatch(text) {
  const n = norm(text);
  return n ? candidates().find((p) => norm(p.name) === n) || null : null;
}

function toast(msg){ const t=$("toast"); t.textContent=msg; t.classList.add("show"); setTimeout(()=>t.classList.remove("show"),2500); }

function renderKubun() {
  $("f-kubun").innerHTML = KUBUNS.map((k) =>
    `<button type="button" class="${k === selKubun ? "selected" : ""}" onclick="setKubun('${k}')">${k}</button>`).join("");
}
function setKubun(k) {
  selKubun = k; renderKubun();
  if (selProduct?.isIng && k !== "仕込み") { selProduct = null; $("f-search").value = ""; }
  if (selCat && !catList().includes(selCat)) selCat = null;
  renderPanel(); renderBind();
}

/* ---------- 商品コンボボックス（一覧から選ぶ＝紐づけ保証。打つと絞り込み。マスタ外は明示ボタンのみ） ---------- */

let selCat = null;      // カテゴリ絞り込み（nullはすべて）
let freeText = null;    // 「マスタ外として登録」を明示的に選んだときだけ入る

function itemCat(p) { return p.isIng ? (p.category === "生地" ? "生地" : "半製品") : (p.category || "その他"); }
// 見分ける文字は名前の先頭に置く（末尾だと折り返しで読まれない・genba指摘）
function itemLabel(p) {
  if (!p.isIng) return esc(p.name);
  if (p.category === "生地") return `<b>生地｜</b>${esc(p.name.replace(/生地$/, ""))}`;
  return `${esc(p.name)}〔半製品〕`;
}
function catList() {
  const cats = [...new Set(candidates().map(itemCat))];
  // 生地・半製品は末尾に固定（生地→半製品の順）
  return cats.sort((a, b) => (a === "半製品") - (b === "半製品") || (a === "生地") - (b === "生地") || a.localeCompare(b, "ja"));
}

function openPanel() { $("f-panel").style.display = "block"; renderPanel(); }
function closePanel() { $("f-panel").style.display = "none"; }

function renderPanel() {
  const cats = catList();
  $("f-cats").innerHTML =
    `<button type="button" class="${selCat === null ? "selected" : ""}" onclick="setCat(null)">すべて</button>` +
    cats.map((c) => `<button type="button" class="${selCat === c ? "selected" : ""}" onclick="setCat('${esc(c)}')">${esc(c)}</button>`).join("");
  const q = $("f-search").value.trim();
  let list = candidates();
  if (selCat) list = list.filter((p) => itemCat(p) === selCat);
  if (q) list = list.filter((p) => p.name.includes(q) || norm(p.name).includes(norm(q)));
  let html = list.slice(0, 40).map((p) =>
    `<button type="button" onclick="pick('${p.id}')">${itemLabel(p)}</button>`).join("");
  if (!list.length) html = `<div class="none">一致する商品がありません</div>`;
  if (list.length > 40) html += `<div class="none">ほか${list.length - 40}件（打って絞り込んでください）</div>`;
  // マスタ外は明示ボタンのみ（打っただけでは自由入力にならない）
  if (q && !exactMatch(q)) html += `<button type="button" class="free" onclick="pickFree()">「${esc(q)}」をマスタ外として登録（在庫連動なし）</button>`;
  $("f-list").innerHTML = html;
}
function setCat(c) { selCat = c; renderPanel(); }

function pick(pid) {
  selProduct = candidates().find((p) => p.id === pid);
  freeText = null;
  $("f-search").value = selProduct.name;
  $("f-yield").textContent = selProduct.yield_per_batch ? `1バッチ = ${Number(selProduct.yield_per_batch)}個` : "";
  closePanel();
  renderBind();
}
function pickFree() {
  freeText = $("f-search").value.trim();
  selProduct = null;
  $("f-yield").textContent = "";
  closePanel();
  renderBind();
}

function renderBind() {
  const el = $("f-bind");
  const text = $("f-search").value.trim();
  if (selProduct) {
    el.className = "bind-state ok";
    el.textContent = `✔ ${selProduct.name}${selProduct.isIng ? "〔半製品〕" : ""}（レシピ・在庫連動あり）`;
  } else if (freeText) {
    el.className = "bind-state warn";
    el.textContent = `マスタ外「${freeText}」で登録します（在庫連動なし）`;
  } else if (text) {
    const exact = exactMatch(text);
    el.className = "bind-state warn";
    el.textContent = exact
      ? `登録時に「${exact.name}」へ自動で紐づきます（名前が一致）`
      : "一覧から選んでください（マスタ外にする場合はパネル内の黄色いボタン）";
  } else {
    el.className = "bind-state";
    el.textContent = "";
  }
}

$("f-search").addEventListener("input", () => { selProduct = null; freeText = null; $("f-yield").textContent = ""; openPanel(); renderBind(); });
$("f-search").addEventListener("focus", openPanel);
$("f-toggle").addEventListener("click", () => {
  $("f-panel").style.display === "block" ? closePanel() : openPanel();
});

$("form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const date = $("f-date").value;
  const text = $("f-search").value.trim();
  if (!date || (!selProduct && !freeText && !text)) { toast("日付と商品を入れてください"); return; }
  // 打っただけで登録を押した場合：名前が一致（表記ゆれ吸収）すれば紐づけ、しなければ選ばせる
  if (!selProduct && !freeText && text) {
    selProduct = exactMatch(text);
    if (!selProduct) { openPanel(); toast("一覧から選んでください（マスタ外は黄色いボタン）"); return; }
  }
  const row = {
    plan_date: date,
    task_category: selKubun,
    batch_count: Number($("f-batch").value) || 1,
    memo: $("f-memo").value.trim() || null,
    source: "app",
    tenant_id: await myTenantId(),
  };
  if (selProduct) { if (selProduct.isIng) row.ingredient_id = selProduct.id; else row.product_id = selProduct.id; }
  else row.title = freeText;
  try {
    await insert("production_plans", row);
    $("f-msg").textContent = selProduct
      ? `登録しました：${mmdd(date)} ${selKubun}「${selProduct.name}」（マスタ紐づけ✔）`
      : `登録しました：${mmdd(date)} ${selKubun}「${freeText}」（マスタ外・在庫連動なし）`;
    // 連続登録モード：日付・区分は保持、商品・メモだけクリア
    selProduct = null; freeText = null; $("f-search").value = ""; $("f-memo").value = ""; $("f-yield").textContent = "";
    closePanel(); renderBind(); loadWeek();
  } catch (err) { toast("登録に失敗しました"); console.error(err); }
});

let _tid = null;
async function myTenantId() {
  if (!_tid) _tid = (await rpc("fn_my_tenant_id")) || null;
  return _tid;
}

/* ---------- 週一覧 ---------- */

function startOfWeek(d) {
  const x = new Date(d); x.setDate(x.getDate() - ((x.getDay() + 6) % 7)); return x; // 月曜始まり
}
function iso(d){ return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`; }
function moveWeek(n){ weekStart.setDate(weekStart.getDate() + n*7); loadWeek(); }

async function loadWeek() {
  const from = iso(weekStart);
  const endD = new Date(weekStart); endD.setDate(endD.getDate() + 6);
  const to = iso(endD);
  $("wk-label").textContent = `${mmdd(from)} 〜 ${mmdd(to)}`;
  const rows = await rest(`production_plans?select=*,products(name),ingredients(name)&plan_date=gte.${from}&plan_date=lte.${to}&order=plan_date,created_at`);
  const byDay = {};
  for (const r of rows) (byDay[r.plan_date] ||= []).push(r);
  const days = ["月","火","水","木","金","土","日"];
  let html = "";
  for (let i = 0; i < 7; i++) {
    const d = new Date(weekStart); d.setDate(d.getDate() + i);
    const key = iso(d);
    const isToday = key === todayStr();
    html += `<div class="week-day ${isToday ? "today" : ""}">${mmdd(key)}（${days[i]}）${isToday ? " — 今日" : ""}</div>`;
    for (const r of (byDay[key] || [])) {
      const name = r.item_name || r.title || r.products?.name || r.ingredients?.name || "（名称なし）";
      const cls = KUBUN_CLASS[r.task_category] || "sonota";
      const st = r.status === "完了" ? "st-done" : "";
      const batch = !r.title && r.batch_count ? ` ×${Number(r.batch_count)}` : "";
      // 仕込みなのに紐づいていない行＝在庫連動なし。翌朝の一覧で気づけるようにマークする
      const freeMark = r.task_category === "仕込み" && !r.product_id && !r.ingredient_id
        ? ' <span class="free-mark">自由</span>' : "";
      const canDel = r.status === "予定" && r.source === "app";
      html += `<div class="mini-card ${st}" style="border-left-color:var(--c-${cls})">
        <span><span class="kubun" style="background:var(--c-${cls})">${esc(r.task_category)}</span>
        ${esc(name)}${batch}${freeMark}${r.status !== "予定" ? `・${r.status}` : ""}</span>
        ${canDel ? `<span class="del" onclick="delPlan('${r.id}')">削除</span>` : ""}</div>`;
    }
    if (!(byDay[key] || []).length) html += `<div class="detail" style="margin:2px 6px">—</div>`;
  }
  $("week").innerHTML = html;
}

async function delPlan(id) {
  if (!confirm("この予定を削除しますか？")) return;
  try {
    await apiFetch(`/rest/v1/production_plans?id=eq.${id}`, { method: "DELETE" });
    loadWeek();
  } catch (e) { toast("削除に失敗しました"); }
}

/* ---------- 起動 ---------- */

if (requireLogin()) {
  $("f-date").value = (() => { const d = new Date(); d.setDate(d.getDate() + 1); return iso(d); })(); // デフォルト明日
  weekStart = startOfWeek(new Date());
  renderKubun();
  Promise.all([
    rest("products?select=id,name,category,yield_per_batch&is_active=eq.true&order=name&limit=300"),
    rest("ingredients?kind=eq.半製品&is_active=eq.true&select=id,name,category&order=name"),
  ]).then(([p, h]) => {
    products = p;
    hanseihin = h.map((x) => ({ ...x, isIng: true }));
  });
  loadWeek().catch((e) => toast("読み込みエラー"));
}
</script>
</body>
</html>
